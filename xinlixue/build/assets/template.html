<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>__TITLE__</title>
<style>
:root{
  --bg:#eef1f7; --card:#ffffff; --card2:#f7f9fc; --line:#e3e8f0;
  --txt:#1a2233; --txt2:#5b6a83; --txt3:#93a1b8;
  --pri:#4a6cf7; --pri-l:#eaeffe; --pri-d:#3552d8;
  --ok:#12b76a; --ok-l:#e6f8ef;
  --no:#f04438; --no-l:#feeceb;
  --warn:#f79009; --warn-l:#fff5e6;
  --star:#f5a524;
  --fs:16px;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  font-size:var(--fs); line-height:1.65;
  display:flex; justify-content:center;
  overscroll-behavior-y:none;
}
#app{
  width:100%; max-width:430px; min-height:100vh; background:var(--bg);
  display:flex; flex-direction:column; position:relative;
  box-shadow:0 0 40px rgba(20,35,70,.08);
}
.hide{display:none !important}

/* ---------- 顶栏 ---------- */
.topbar{
  background:linear-gradient(135deg,#4a6cf7,#7a5cf7);
  color:#fff; padding:14px 16px 16px; border-radius:0 0 18px 18px;
  position:sticky; top:0; z-index:30;
  box-shadow:0 4px 16px rgba(74,108,247,.22);
}
.topbar h1{margin:0;font-size:18px;font-weight:600;letter-spacing:.3px}
.topbar .sub{font-size:12px;opacity:.82;margin-top:2px}
.tb-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tb-btn{
  background:rgba(255,255,255,.18); border:none; color:#fff;
  width:34px;height:34px;border-radius:11px;font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;
  transition:.15s;
}
.tb-btn:active{transform:scale(.93);background:rgba(255,255,255,.3)}

/* 全局概览 */
.ov{display:flex;gap:8px;margin-top:14px}
.ov .it{
  flex:1;background:rgba(255,255,255,.16);border-radius:11px;
  padding:7px 4px;text-align:center;
}
.ov .it b{display:block;font-size:17px;font-weight:600;line-height:1.3}
.ov .it span{font-size:11px;opacity:.85}

/* ---------- 内容区 ---------- */
.page{flex:1;padding:14px 14px 92px;overflow-y:auto}
.sec-title{font-size:13px;color:var(--txt2);font-weight:600;margin:4px 2px 10px;letter-spacing:.5px}
.mod-head{display:flex;align-items:center;gap:8px;margin:18px 2px 10px;padding-left:9px;border-left:3px solid var(--pri)}
.mod-head .mh-t{font-size:14px;font-weight:700;color:var(--txt)}
.mod-head .mh-n{margin-left:auto;font-size:11.5px;color:var(--txt3)}

/* 章节卡片 */
.chap{
  background:var(--card);border-radius:var(--r);padding:13px 14px;margin-bottom:10px;
  box-shadow:0 1px 3px rgba(24,40,80,.06);cursor:pointer;transition:.15s;
  border:1px solid transparent;
}
.chap:active{transform:scale(.985);border-color:var(--pri);background:var(--pri-l)}
.chap.done{border-color:var(--ok)}
.ch-top{display:flex;align-items:flex-start;gap:10px}
.ch-no{
  flex:0 0 auto;width:26px;height:26px;border-radius:9px;background:var(--pri-l);
  color:var(--pri);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:2px;
}
.chap.done .ch-no{background:var(--ok-l);color:var(--ok)}
.ch-name{flex:1;font-weight:600;font-size:15px;line-height:1.45}
.ch-meta{font-size:12px;color:var(--txt3);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap}
.ch-meta .g{color:var(--ok);font-weight:600}
.ch-meta .r{color:var(--no);font-weight:600}
.ch-meta .sliced{color:var(--pri);font-weight:600}
.bar{height:6px;background:var(--line);border-radius:4px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#4a6cf7,#7a5cf7);border-radius:4px;transition:width .4s}
.chap.done .bar i{background:linear-gradient(90deg,#12b76a,#0ea5a5)}
.ch-badge{
  font-size:10px;padding:1px 6px;border-radius:6px;background:var(--ok-l);color:var(--ok);font-weight:600;
}

/* ---------- 底部导航 ---------- */
.nav{
  position:fixed;bottom:0;width:100%;max-width:430px;
  background:rgba(255,255,255,.96);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);display:flex;z-index:40;
  padding-bottom:env(safe-area-inset-bottom);
}
.nav button{
  flex:1;background:none;border:none;padding:8px 0 9px;cursor:pointer;
  color:var(--txt3);font-size:11px;font-family:inherit;position:relative;transition:.15s;
}
.nav button .ic{display:block;font-size:19px;line-height:1.25}
.nav button.on{color:var(--pri);font-weight:600}
.nav button .dot{
  position:absolute;top:6px;right:calc(50% - 20px);
  min-width:15px;height:15px;padding:0 4px;border-radius:8px;background:var(--no);color:#fff;
  font-size:10px;line-height:15px;font-weight:600;text-align:center;display:none;
}
.nav button .dot.show{display:block}

/* ---------- 刷题页 ---------- */
.qhead{
  position:sticky;top:0;z-index:20;background:rgba(238,241,247,.97);backdrop-filter:blur(8px);
  padding:10px 14px 8px;margin:-14px -14px 12px;border-bottom:1px solid var(--line);
}
.qhead .r1{display:flex;align-items:center;gap:10px}
.back{
  background:none;border:none;font-size:20px;color:var(--txt2);cursor:pointer;padding:0 2px;line-height:1;
}
.qhead .ttl{flex:1;font-size:13px;font-weight:600;color:var(--txt2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mode-tag{
  font-size:11px;padding:3px 9px;border-radius:8px;background:var(--pri-l);color:var(--pri);
  font-weight:600;cursor:pointer;border:none;font-family:inherit;flex:0 0 auto;
}
.mode-tag.recite{background:var(--warn-l);color:var(--warn)}
.qhead .r2{display:flex;align-items:center;gap:8px;margin-top:9px;font-size:11px;color:var(--txt3)}
.qhead .r2 .pbar{flex:1;height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.qhead .r2 .pbar i{display:block;height:100%;background:var(--pri);border-radius:3px;transition:width .3s}

/* 题目卡 */
.qcard{
  background:var(--card);border-radius:var(--r);padding:16px 15px 14px;
  box-shadow:0 1px 3px rgba(24,40,80,.06);margin-bottom:12px;
}
.tagrow{display:flex;align-items:center;gap:7px;margin-bottom:10px}
.ttype{
  font-size:11px;padding:2px 8px;border-radius:6px;background:var(--pri-l);color:var(--pri);font-weight:600;
}
.ttype.mul{background:#f3ebff;color:#8b5cf6}
.ttype.jud{background:#e6f8ef;color:#12b76a}
.star{
  margin-left:auto;background:none;border:none;font-size:20px;cursor:pointer;color:#d5dce8;
  padding:0 2px;line-height:1;transition:.15s;
}
.star.on{color:var(--star);transform:scale(1.08)}
.stem{font-size:var(--fs);line-height:1.72;font-weight:500;word-break:break-word}
.stem .num{color:var(--pri);font-weight:700;margin-right:2px;font-size:calc(var(--fs) - 2px)}
.flag{
  display:inline-block;font-size:10px;padding:1px 6px;border-radius:5px;
  background:var(--warn-l);color:var(--warn);margin-left:6px;font-weight:600;vertical-align:middle;
}

/* 选项 */
.opts{margin-top:14px}
.opt{
  display:flex;gap:10px;align-items:flex-start;
  border:1.5px solid var(--line);border-radius:11px;padding:13px 14px;margin-bottom:12px;
  cursor:pointer;transition:.15s;background:var(--card2);font-size:calc(var(--fs) - 1px);line-height:1.65;
}
.opt:active{transform:scale(.99)}
.opt .k{
  flex:0 0 auto;width:23px;height:23px;border-radius:50%;background:#fff;border:1.5px solid var(--line);
  color:var(--txt2);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;
  margin-top:1px;transition:.15s;
}
.opt .v{flex:1;word-break:break-word}
.opt.sel{border-color:var(--pri);background:var(--pri-l)}
.opt.sel .k{background:var(--pri);border-color:var(--pri);color:#fff}
.opt.ok{border-color:var(--ok);background:var(--ok-l)}
.opt.ok .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.no{border-color:var(--no);background:var(--no-l)}
.opt.no .k{background:var(--no);border-color:var(--no);color:#fff}
.opt.dis{cursor:default}
.opt.dis:active{transform:none}

/* 解析 */
.ana{
  margin-top:12px;border-radius:12px;overflow:hidden;border:1px solid var(--line);
  animation:fade .25s ease;
}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ana .hd{
  padding:9px 13px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px;
}
.ana.right .hd{background:var(--ok-l);color:var(--ok)}
.ana.wrong .hd{background:var(--no-l);color:var(--no)}
.ana.neutral .hd{background:var(--pri-l);color:var(--pri)}
.ana .bd{padding:12px 13px;font-size:calc(var(--fs) - 2px);line-height:1.75;background:var(--card);color:var(--txt2)}
.ana .bd b{color:var(--txt);font-weight:600}
.ana .bd .ansline{
  font-size:calc(var(--fs) - 1px);color:var(--txt);background:var(--card2);
  border-radius:8px;padding:8px 11px;margin-bottom:10px;line-height:1.6;
}
.ana .bd .ansline b{color:var(--pri);font-size:calc(var(--fs) + 1px);letter-spacing:1px}
.ana .bd .ansline.jud b{color:var(--ok)}
.ana .bd .row{display:flex;gap:8px;margin-top:7px}
.ana .bd .row .lb{
  flex:0 0 auto;font-weight:600;color:var(--txt);
}
.ana .bd .row .tx{flex:1}
.ana .bd .row.rt .lb{color:var(--ok)}
.ana .bd .row.wn .lb{color:var(--no)}
.ana .bd .row.an .lb{color:var(--pri)}

/* 详细解析（analysis 字段注入的 HTML） */
.ana .bd .analysis{margin-top:8px;font-size:calc(var(--fs) - 2px);line-height:1.8;color:var(--txt2);word-break:break-word}
.ana .bd .analysis h3{
  margin:12px 0 5px;font-size:calc(var(--fs) - 2px);font-weight:700;color:var(--pri);
  display:flex;align-items:center;gap:5px;letter-spacing:.2px;
}
.ana .bd .analysis h3:first-child{margin-top:2px}
.ana .bd .analysis p{margin:5px 0}
.ana .bd .analysis ul,.ana .bd .analysis ol{margin:5px 0;padding-left:20px}
.ana .bd .analysis li{margin:4px 0}
.ana .bd .analysis strong{font-weight:700;color:var(--txt)}
.ana .bd .analysis .hl{color:var(--pri);font-weight:700}
.ana .bd .analysis .ok{color:var(--ok);font-weight:700}
.ana .bd .analysis .no{color:var(--no);font-weight:700}
.ana .bd .analysis .wr{color:var(--warn);font-weight:700}
.ana .bd .analysis table.knowledge-table{
  width:100%;border-collapse:collapse;margin:8px 0;font-size:calc(var(--fs) - 3px);
}
.ana .bd .analysis table.knowledge-table th,
.ana .bd .analysis table.knowledge-table td{
  border:1px solid var(--line);padding:6px 8px;text-align:left;line-height:1.6;
}
.ana .bd .analysis table.knowledge-table th{background:var(--pri-l);color:var(--pri-d);font-weight:700}
/* code 用于技术类知识点的命令 / 代码 / 术语，兜底补一条等宽样式，避免退化成浏览器默认 */
.ana .bd .analysis code{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace;
  font-size:calc(var(--fs) - 3px);background:var(--card2);color:var(--pri-d);
  border:1px solid var(--line);border-radius:5px;padding:1px 5px;
  word-break:break-all;
}
/* pre 用于 ASCII 层次图 / 多行示意，需保留换行与对齐 */
.ana .bd .analysis pre{
  background:var(--card2);border:1px solid var(--line);border-radius:8px;
  padding:9px 11px;margin:8px 0;overflow-x:auto;line-height:1.55;
}
.ana .bd .analysis pre code{
  background:none;border:none;padding:0;color:var(--txt2);font-size:calc(var(--fs) - 3px);
  white-space:pre;word-break:normal;
}
.ana .bd .analysis .tip{
  margin-top:9px;background:var(--warn-l);border-left:3px solid var(--warn);
  border-radius:8px;padding:8px 10px;color:var(--txt2);
}
/* 解析来源徽章：详细 / 基础 */
.ana .bd .src-tag{
  font-size:calc(var(--fs) - 5px);font-weight:600;padding:1px 7px;border-radius:6px;
  margin-left:auto;background:var(--card2);color:var(--txt3);white-space:nowrap;
}
.ana .bd .ana-hd{display:flex;align-items:center;gap:6px}
.ana .bd .src-tag.detail{background:var(--pri-l);color:var(--pri)}

/* 底部操作 */
.actbar{
  position:fixed;bottom:0;width:100%;max-width:430px;background:rgba(255,255,255,.97);
  backdrop-filter:blur(12px);border-top:1px solid var(--line);
  display:flex;gap:9px;padding:10px 12px;z-index:35;
  padding-bottom:calc(10px + env(safe-area-inset-bottom));
}
.btn{
  flex:1;border:none;border-radius:11px;padding:12px 0;font-size:15px;font-family:inherit;
  font-weight:600;cursor:pointer;transition:.15s;
  word-break:break-word;line-height:1.35;
}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--pri);color:#fff;box-shadow:0 3px 10px rgba(74,108,247,.28)}
.btn.pri:disabled{background:#c9d3e8;box-shadow:none;color:#fff}
.btn.gho{background:var(--card2);color:var(--txt2);border:1px solid var(--line);flex:0 0 34%}
.btn.grn{background:var(--ok);color:#fff;box-shadow:0 3px 10px rgba(18,183,106,.26)}
.btn.sm{flex:0 0 auto;padding:12px 16px}

/* 答题卡 */
.mask{
  position:fixed;inset:0;background:rgba(18,28,50,.42);z-index:60;opacity:0;pointer-events:none;transition:.2s;
}
.mask.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;bottom:0;left:50%;transform:translate(-50%,100%);
  width:100%;max-width:430px;max-height:78vh;background:var(--card);
  border-radius:20px 20px 0 0;z-index:61;transition:transform .28s cubic-bezier(.22,.7,.3,1);
  display:flex;flex-direction:column;
}
.sheet.on{transform:translate(-50%,0)}
.sheet .sh{padding:15px 18px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.sheet .sh b{font-size:16px}
.sheet .sh .cl{margin-left:auto;background:none;border:none;font-size:20px;color:var(--txt3);cursor:pointer;line-height:1}
.legend{display:flex;gap:14px;padding:10px 18px 4px;font-size:11px;color:var(--txt2);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.grid{
  flex:1;overflow-y:auto;padding:10px 18px 20px;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:9px;
}
.gi{
  aspect-ratio:1;border-radius:10px;border:1.5px solid var(--line);background:var(--card2);
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;
  color:var(--txt2);cursor:pointer;position:relative;transition:.15s;
}
.gi:active{transform:scale(.93)}
.gi.ok{background:var(--ok-l);border-color:var(--ok);color:var(--ok)}
.gi.no{background:var(--no-l);border-color:var(--no);color:var(--no)}
.gi.cur{border-color:var(--pri);background:var(--pri);color:#fff;box-shadow:0 3px 9px rgba(74,108,247,.35)}
.gi .s{position:absolute;top:-3px;right:-3px;font-size:10px;color:var(--star)}

/* 结果页 */
.result{text-align:center;padding:36px 20px 20px}
.result .big{font-size:52px;font-weight:700;line-height:1.1;color:var(--pri)}
.result .lb{font-size:13px;color:var(--txt3);margin-top:6px}
.rgrid{display:flex;gap:10px;margin:22px 0}
.rgrid .c{
  flex:1;background:var(--card);border-radius:var(--r);padding:13px 6px;box-shadow:0 1px 3px rgba(24,40,80,.06);
}
.rgrid .c b{display:block;font-size:22px;font-weight:700;line-height:1.2}
.rgrid .c span{font-size:11px;color:var(--txt3)}
.rgrid .c.g b{color:var(--ok)}
.rgrid .c.r b{color:var(--no)}
.rgrid .c.b b{color:var(--pri)}
.done-hint{font-size:12px;color:var(--txt3);margin-top:4px}

/* 列表页（错题/收藏） */
.tabs{display:flex;background:var(--card);border-radius:12px;padding:4px;margin-bottom:12px;box-shadow:0 1px 3px rgba(24,40,80,.06)}
.tabs button{
  flex:1;border:none;background:none;padding:9px 0;border-radius:9px;font-size:13px;font-weight:600;
  color:var(--txt3);cursor:pointer;font-family:inherit;transition:.15s;
}
.tabs button.on{background:var(--pri);color:#fff;box-shadow:0 2px 7px rgba(74,108,247,.26)}

/* 按章分组 */
.grp{background:var(--card);border-radius:12px;margin-bottom:9px;box-shadow:0 1px 3px rgba(24,40,80,.06);overflow:hidden;border:1px solid transparent}
.grp.open{border-color:var(--pri-l)}
.grp-head{
  display:flex;align-items:center;gap:9px;padding:12px 13px;cursor:pointer;transition:.15s;user-select:none;
}
.grp-head:active{background:var(--card2)}
.grp .arrow{flex:0 0 auto;width:14px;color:var(--pri);font-size:12px;transition:.2s}
.grp-name{flex:1;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grp-count{
  flex:0 0 auto;font-size:11px;font-weight:600;color:var(--pri);background:var(--pri-l);
  border-radius:7px;padding:2px 8px;
}
.grp-go{
  flex:0 0 auto;border:none;background:var(--card2);color:var(--txt2);font-family:inherit;
  font-size:11px;font-weight:600;border-radius:8px;padding:5px 10px;cursor:pointer;transition:.15s;
}
.grp-go:active{transform:scale(.95);background:var(--pri-l);color:var(--pri)}
.grp-body{padding:0 10px 8px;border-top:1px solid var(--line);animation:fade .2s ease}
.grp-body .li{margin-top:8px;box-shadow:none;background:var(--card2)}
.li.mastered{opacity:.62}
.li.mastered .stem2{text-decoration:none}

/* 本轮进度卡 */
.round-card{
  background:linear-gradient(135deg,#4a6cf7,#7a5cf7);color:#fff;border-radius:var(--r);
  padding:14px 15px;margin-bottom:12px;box-shadow:0 4px 14px rgba(74,108,247,.2);
}
.round-card h3{margin:0 0 4px;font-size:15px;display:flex;align-items:center;gap:7px}
.round-card .sub{font-size:11px;opacity:.85;margin-bottom:11px}
.round-card .bar2{height:6px;background:rgba(255,255,255,.25);border-radius:4px;overflow:hidden}
.round-card .bar2 i{display:block;height:100%;background:#fff;border-radius:4px;transition:width .35s}
.round-acts{display:flex;gap:9px;margin-top:12px}
.round-acts button{
  flex:1;border:none;border-radius:10px;padding:10px 0;font-family:inherit;font-size:13px;
  font-weight:600;cursor:pointer;transition:.15s;
}
.round-acts .b1{background:#fff;color:var(--pri)}
.round-acts .b2{background:rgba(255,255,255,.2);color:#fff}
.round-acts button:active{transform:scale(.97)}

/* 题量选择 */
.nmgrid{display:flex;gap:8px;flex-wrap:wrap}
.nmgrid button{
  flex:1;min-width:calc(25% - 6px);border:1.5px solid var(--line);background:var(--card2);
  border-radius:10px;padding:9px 4px;cursor:pointer;font-family:inherit;color:var(--txt2);
  font-weight:600;font-size:13px;transition:.15s;
}
.nmgrid button.on{border-color:var(--pri);background:var(--pri-l);color:var(--pri)}
.nmcustom{display:flex;gap:8px;margin-top:10px}
.nmcustom input{
  flex:1;border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;font-family:inherit;
  font-size:14px;color:var(--txt);background:var(--card2);outline:none;
}
.nmcustom input:focus{border-color:var(--pri);background:#fff}
.nmcustom button{
  flex:0 0 auto;border:none;border-radius:10px;padding:9px 16px;background:var(--pri);color:#fff;
  font-family:inherit;font-weight:600;font-size:13px;cursor:pointer;
}
.li{
  background:var(--card);border-radius:12px;padding:12px 13px;margin-bottom:9px;
  box-shadow:0 1px 3px rgba(24,40,80,.06);display:flex;gap:10px;align-items:flex-start;cursor:pointer;
  transition:.15s;
}
.li:active{transform:scale(.985)}
.li .idx{
  flex:0 0 auto;font-size:11px;font-weight:700;color:var(--txt3);background:var(--card2);
  border-radius:7px;padding:2px 7px;margin-top:2px;
}
.li .bd{flex:1;min-width:0}
.li .stem2{font-size:14px;line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.li .mt{font-size:11px;color:var(--txt3);margin-top:5px;display:flex;gap:9px;flex-wrap:wrap}
.li .mt .src{color:var(--pri)}
.li .st{color:var(--star);font-size:16px;line-height:1}
.empty{text-align:center;padding:60px 20px;color:var(--txt3)}
.empty .ic{font-size:44px;margin-bottom:12px;opacity:.5}
.empty p{font-size:13px;margin:4px 0}
.li-act{display:flex;gap:9px;margin-bottom:12px}
.li-act .btn{padding:10px 0;font-size:14px}

/* ---------- 题目搜索 ---------- */
.sbox{
  display:flex;align-items:center;gap:9px;background:var(--card);border-radius:12px;
  padding:10px 12px;box-shadow:0 1px 3px rgba(24,40,80,.06);
  border:1.5px solid transparent;transition:.15s;
}
.sbox:focus-within{border-color:var(--pri);box-shadow:0 3px 12px rgba(74,108,247,.16)}
.sbox .ic{font-size:15px;opacity:.55;flex:0 0 auto}
.sbox input{
  flex:1;min-width:0;border:none;outline:none;background:none;font-family:inherit;
  font-size:15px;color:var(--txt);padding:0;line-height:1.5;
}
.sbox input::-webkit-search-cancel-button{display:none}
.sbox .clr{
  flex:0 0 auto;border:none;background:var(--card2);color:var(--txt3);width:22px;height:22px;
  border-radius:50%;font-size:11px;line-height:1;cursor:pointer;font-family:inherit;padding:0;
}
.frow{margin-top:10px}
.frow select{
  width:100%;font-family:inherit;font-size:13px;color:var(--txt2);background:var(--card);
  border:1px solid var(--line);border-radius:10px;padding:9px 11px;outline:none;
  appearance:none;-webkit-appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--txt3) 50%),linear-gradient(135deg,var(--txt3) 50%,transparent 50%);
  background-position:calc(100% - 16px) 17px,calc(100% - 11px) 17px;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;
}
.fchips{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:9px}
.fchips .flb{font-size:11px;color:var(--txt3);flex:0 0 auto}
.fchips button{
  border:1px solid var(--line);background:var(--card);color:var(--txt2);border-radius:8px;
  padding:5px 11px;font-size:12px;font-weight:600;font-family:inherit;cursor:pointer;transition:.15s;
}
.fchips button.on{background:var(--pri-l);border-color:var(--pri);color:var(--pri)}
.fchips button:active{transform:scale(.96)}
.res{
  background:var(--card);border-radius:12px;padding:12px 13px;margin-bottom:9px;
  box-shadow:0 1px 3px rgba(24,40,80,.06);cursor:pointer;transition:.15s;border:1px solid transparent;
}
.res:active{transform:scale(.985);border-color:var(--pri-l);background:var(--pri-l)}
.res .rh{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--txt3);margin-bottom:6px;flex-wrap:wrap}
.res .rh .cn{background:var(--pri-l);color:var(--pri);border-radius:6px;padding:1px 7px;font-weight:700}
.res .rh .st{
  margin-left:auto;background:none;border:none;color:#d5dce8;font-size:16px;line-height:1;
  cursor:pointer;padding:0 2px;font-family:inherit;
}
.res .rh .st.on{color:var(--star)}
.res .stem2{
  font-size:14px;line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden;word-break:break-word;
}
.res .snip{
  font-size:12px;color:var(--txt2);background:var(--card2);border-radius:8px;padding:6px 9px;
  margin-top:7px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden;
}
.res .mt{font-size:11px;color:var(--txt3);margin-top:6px;display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.res .mt .ans{color:var(--pri);font-weight:700}
mark.kw{background:#fff2b8;color:#8a5a00;border-radius:3px;padding:0 1px;font-weight:600}
.schint{font-size:12px;color:var(--txt3);line-height:1.8}
.schint .hot{
  display:inline-block;margin:5px 6px 0 0;padding:4px 10px;border-radius:8px;
  background:var(--card);border:1px solid var(--line);color:var(--txt2);font-size:12px;
  cursor:pointer;font-family:inherit;font-weight:600;
}
.schint .hot:active{background:var(--pri-l);border-color:var(--pri);color:var(--pri)}

/* 设置面板 */
.setrow{
  background:var(--card);border-radius:12px;padding:14px 15px;margin-bottom:10px;
  box-shadow:0 1px 3px rgba(24,40,80,.06);
}
.setrow .lb{font-size:14px;font-weight:600;margin-bottom:4px}
.setrow .hint{font-size:11px;color:var(--txt3);margin-bottom:11px;line-height:1.5}
.fsgrid{display:flex;gap:8px}
.fsgrid button{
  flex:1;border:1.5px solid var(--line);background:var(--card2);border-radius:10px;padding:9px 0;
  cursor:pointer;font-family:inherit;color:var(--txt2);font-weight:600;transition:.15s;
}
.fsgrid button .p{display:block;font-weight:700;color:var(--txt)}
.fsgrid button.on{border-color:var(--pri);background:var(--pri-l);color:var(--pri)}
.fsgrid button.on .p{color:var(--pri)}
.fs-demo{
  margin-top:12px;background:var(--card2);border-radius:10px;padding:12px;
  font-size:var(--fs);line-height:1.7;border:1px dashed var(--line);
}
.fs-demo .k{color:var(--pri);font-weight:700}

/* 开关（设置项） */
.swrow{display:flex;align-items:center;gap:12px;margin-top:4px}
.swtxt{flex:1;min-width:0}
.swtxt .t{font-size:13px;font-weight:600;color:var(--txt)}
.swtxt .d{font-size:11px;color:var(--txt3);margin-top:3px;line-height:1.5}
.sw{
  flex:0 0 auto;width:46px;height:26px;border-radius:14px;border:none;padding:0;
  background:var(--line);position:relative;cursor:pointer;transition:background .2s;
}
.sw::after{
  content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s;
}
.sw.on{background:var(--pri)}
.sw.on::after{transform:translateX(20px)}
.setrow.off .nmgrid,.setrow.off .nmcustom{opacity:.45;pointer-events:none}

/* 导出文件列表（APK 内可见） */
.explist{display:flex;flex-direction:column;gap:8px}
.exprow{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  background:var(--card2);border-radius:9px;padding:9px 10px;
}
.expinfo{flex:1;min-width:130px}
.expname{
  font-size:12px;font-weight:600;color:var(--txt);line-height:1.4;
  word-break:break-all;
}
.expmeta{font-size:10.5px;color:var(--txt3);margin-top:2px}
.expacts{display:flex;gap:6px;flex-wrap:wrap}
.mini{
  border:1.2px solid var(--line);background:var(--card);color:var(--txt2);
  border-radius:7px;padding:5px 9px;font-size:11px;cursor:pointer;
  font-family:inherit;transition:.15s;
}
.mini:active{background:var(--pri-l);border-color:var(--pri);color:var(--pri)}
.mini.del{color:var(--no);border-color:var(--no)}
.mini.del:active{background:rgba(220,60,60,.1)}

/* 提示条 */
.toast{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.9);
  background:rgba(24,34,58,.9);color:#fff;padding:11px 20px;border-radius:11px;font-size:13px;
  z-index:100;opacity:0;pointer-events:none;transition:.22s;white-space:nowrap;max-width:80vw;
}
.toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}

/* 弹窗 */
.dlg-mask{position:fixed;inset:0;background:rgba(18,28,50,.45);z-index:80;display:flex;align-items:center;justify-content:center;padding:26px;opacity:0;pointer-events:none;transition:.2s}
.dlg-mask.on{opacity:1;pointer-events:auto}
.dlg{background:var(--card);border-radius:16px;padding:20px 18px 16px;width:100%;max-width:320px;transform:scale(.94);transition:.2s}
.dlg-mask.on .dlg{transform:scale(1)}
.dlg h3{margin:0 0 8px;font-size:16px}
.dlg p{margin:0 0 16px;font-size:13px;color:var(--txt2);line-height:1.65}
.dlg .btns{display:flex;gap:9px}
.dlg .btns .btn{padding:10px 0;font-size:14px}

/* 统计页 */
.stat-card{background:var(--card);border-radius:var(--r);padding:15px;margin-bottom:11px;box-shadow:0 1px 3px rgba(24,40,80,.06)}
.stat-card h4{margin:0 0 12px;font-size:14px;display:flex;align-items:center;gap:6px}
.stat-card h4 .n{margin-left:auto;font-size:12px;color:var(--txt3);font-weight:400}
.rows .r{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px}
.rows .r:last-child{border-bottom:none}
.rows .r .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rows .r .vl{font-weight:600;color:var(--txt2);flex:0 0 auto}
.rows .r .vl.g{color:var(--ok)}
.rows .r .vl.r{color:var(--no)}
.kv{display:flex;gap:10px;flex-wrap:wrap}
.kv .x{flex:1;min-width:calc(50% - 5px);background:var(--card2);border-radius:11px;padding:11px;text-align:center}
.kv .x b{display:block;font-size:21px;font-weight:700;color:var(--pri)}
.kv .x span{font-size:11px;color:var(--txt3)}

/* ---------- 章节内的小节列表 ---------- */
.slist{display:none;margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}
.chap.open .slist{display:block}

/* ---------- 章节卡片底部操作：展开小节 / 重做本章 / 历史记录 ---------- */
.chap-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px}
/* 有「先导」后最多 4 个按钮：窄屏放不下就让右侧三个整体换行，
   不要逐个挤——那会把「展开小节」压成三行字 */
.chap-acts .stog{flex:1 1 108px;width:auto;min-width:108px}
.chap-acts .stog .stx{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chap-acts .cbtns{display:flex;gap:8px;flex:0 0 auto}
.stog{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;margin-top:0;padding:8px 10px;border:0;border-radius:9px;background:var(--card2);color:var(--txt2);font-family:inherit;font-size:12.5px;text-align:left;cursor:pointer;transition:.12s}
.stog:active{background:var(--pri-l)}
.stog .arw{flex:0 0 auto;font-size:10px;color:var(--txt3);transition:transform .18s}
.chap.open .stog .arw{transform:rotate(180deg)}
.cbtn{flex:0 0 auto;padding:8px 10px;border:0;border-radius:9px;background:var(--card2);color:var(--txt2);font-family:inherit;font-size:12.5px;cursor:pointer;transition:.12s;display:flex;align-items:center;gap:4px}
.cbtn:active{background:var(--pri-l)}
.cbtn.redo{color:var(--pri)}
.cbtn.hist{color:var(--txt2)}
.cbtn.guide{color:var(--ok)}
.cbtn .num{font-variant-numeric:tabular-nums;font-weight:700}

/* ---------- 先导知识 ---------- */
/* 章头：整章的「封面」，把章节号、章名、导语、规模三件事一次说清 */
.ghero{position:relative;overflow:hidden;border-radius:16px;padding:17px 16px 15px;margin-bottom:12px;
  background:linear-gradient(158deg,#f3f6ff 0%,#fdfdff 58%,#fff 100%);
  border:1px solid #e4eafa;box-shadow:0 3px 14px rgba(74,108,247,.07)}
.ghero::after{content:'';position:absolute;right:-46px;top:-52px;width:150px;height:150px;border-radius:50%;
  background:radial-gradient(circle,rgba(122,92,247,.16),rgba(122,92,247,0) 68%);pointer-events:none}
.gno{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;color:var(--pri);
  background:var(--pri-l);border-radius:999px;padding:3px 10px;letter-spacing:.4px}
.ghero h2{margin:10px 0 0;font-size:22px;line-height:1.3;font-weight:800;letter-spacing:.3px;color:#141d33}
.ghero h2 .gmod{display:inline-block;vertical-align:4px;margin-left:8px;font-size:10.5px;font-weight:600;
  color:var(--txt2);background:#fff;border:1px solid var(--line);border-radius:6px;padding:1px 6px;letter-spacing:0}
/* 导语：默认折到 5 行，避免一屏全是灰字；超出才出「展开全文」 */
.glead{margin:12px 0 0;font-size:13.5px;line-height:1.95;color:#45506a;text-align:justify;
  display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.glead.open{display:block;overflow:visible}
.glead b{color:#141d33;font-weight:700}
.gmore{display:none;margin:7px 0 0;padding:0;border:none;background:none;color:var(--pri);
  font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;letter-spacing:.3px}
/* 导语里的 ☆ 是课件标的重点，换成暖色实心星，一眼看见 */
.gstar{color:var(--star);font-style:normal;font-weight:700;margin-right:1px}
.gstats{display:flex;gap:7px;margin-top:14px}
.gstats .x{flex:1;background:rgba(255,255,255,.9);border:1px solid #e8eefb;border-radius:11px;padding:7px 4px 6px;text-align:center}
.gstats .x b{display:block;font-size:16px;font-weight:800;color:var(--pri);line-height:1.25;font-variant-numeric:tabular-nums}
.gstats .x span{font-size:10.5px;color:var(--txt3);letter-spacing:.3px}

/* 小节切换：编号方块 + 名称，选中态上渐变色 */
.gintro{font-size:13.5px;line-height:1.95;color:var(--txt2);margin:0 0 10px}
.gbar{display:flex;justify-content:space-between;font-size:11px;color:var(--txt3);margin:0 0 6px;letter-spacing:.3px}
.gprog{height:4px;border-radius:3px;background:#e9eefb;overflow:hidden;margin:0 0 11px}
.gprog i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#4a6cf7,#7a5cf7);transition:width .3s}
.gchips{display:flex;flex-wrap:wrap;gap:7px}
.gchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;
  color:var(--txt2);border-radius:11px;padding:7px 11px 7px 8px;font-family:inherit;font-size:12.5px;
  line-height:1.25;cursor:pointer;transition:.15s;text-align:left}
.gchip .gi{flex:0 0 auto;width:17px;height:17px;border-radius:6px;background:var(--pri-l);color:var(--pri);
  font-size:10.5px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;font-style:normal}
.gchip.on{background:linear-gradient(135deg,#4a6cf7,#7a5cf7);border-color:transparent;color:#fff;
  font-weight:700;box-shadow:0 4px 12px rgba(74,108,247,.26)}
.gchip.on .gi{background:rgba(255,255,255,.24);color:#fff}
.gchip:active{transform:scale(.97)}

/* 考点地图：把树状图折成一串可扫读的胶囊，长的自然换行占满一行 */
.gmap{display:flex;flex-wrap:wrap;gap:6px}
.gm{display:flex;align-items:center;gap:6px;min-width:0;max-width:100%}
.gm .gmt{min-width:0;overflow-wrap:anywhere}
.gm.lv0{flex:0 0 100%;margin-top:12px;font-size:13.5px;font-weight:800;color:#141d33;letter-spacing:.2px}
.gm.lv0:first-child{margin-top:0}
.gm.lv0 .gmt::before{content:'';display:inline-block;width:3px;height:13px;border-radius:2px;
  background:linear-gradient(#4a6cf7,#7a5cf7);margin-right:7px;vertical-align:-1px}
.gm.lv1{flex:0 1 auto;background:var(--card2);border:1px solid #edf1fa;border-radius:8px;
  padding:5px 9px;font-size:12.5px;line-height:1.45;color:#46536b}
.gm.lv2{flex:0 1 auto;padding-left:16px;font-size:12px;color:var(--txt3)}
.gmn{flex:0 0 auto;font-size:10px;font-weight:700;color:#C0392B;background:#FCEDEB;border-radius:5px;
  padding:0 4px;line-height:1.6}

/* 正文：把「一大块灰色的字」拆成有编号、有节奏的段落 */
.gbody{padding:16px 16px calc(72px + env(safe-area-inset-bottom))}
.gbody h3.gh{display:flex;align-items:center;gap:8px;margin:22px 0 9px;font-size:15.5px;font-weight:800;
  color:#141d33;line-height:1.4;letter-spacing:.2px}
.gbody h3.gh:first-child{margin-top:0}
.gbody h3.gh .ghn{flex:0 0 auto;width:20px;height:20px;border-radius:7px;font-style:normal;font-size:11.5px;
  font-weight:800;color:#fff;background:linear-gradient(135deg,#4a6cf7,#7a5cf7);display:inline-flex;
  align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(74,108,247,.28);letter-spacing:0}
.gbody h3.gh::after{content:'';flex:1 1 auto;height:1px;background:linear-gradient(90deg,#e7ecfb,rgba(231,236,251,0))}
.gbody .gp{margin:9px 0;font-size:14px;line-height:2;color:#3b465e;text-align:justify}
.gbody .gp b,.gul li b{color:#141d33;font-weight:700}
.gul{margin:9px 0;padding:0;list-style:none}
.gul li{position:relative;margin:7px 0;padding-left:15px;font-size:13.5px;line-height:1.92;color:#3b465e}
.gul li::before{content:'';position:absolute;left:2px;top:.68em;width:5px;height:5px;border-radius:50%;
  background:#8ba3f5}
.gbody .tip{margin:11px 0;padding:10px 12px;border-radius:11px;background:var(--card2);
  border-left:3px solid #ccd8f6;font-size:12.5px;line-height:1.9;color:#54627d}

/* 口诀卡：暖色卡片，和蓝色的知识正文区分开，背的时候一眼能找到 */
.gkj{position:relative;margin:12px 0;padding:11px 13px 11px 16px;border-radius:12px;
  background:linear-gradient(135deg,#fff7ea,#fffdf8);border:1px solid #f8e3bf;overflow:hidden}
.gkj::before{content:'';position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:3px;
  background:linear-gradient(#f5a524,#f79009)}
.gkh{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
.gktag{flex:0 0 auto;font-size:10px;font-weight:800;color:#a76000;background:#fbeacb;border-radius:5px;
  padding:1px 5px;letter-spacing:.5px}
.gkc{flex:0 1 auto;min-width:0;max-width:100%;font-size:14.5px;font-weight:800;color:#a8490c;
  letter-spacing:.8px;line-height:1.6;overflow-wrap:anywhere}
.gkd{margin-top:5px;font-size:12.5px;line-height:1.85;color:#6d5b45;overflow-wrap:anywhere}
.gkd b{color:#4a3a26;font-weight:700}

/* 表格：给表头底色、斑马行、圆角边框，别再裸表 */
.gtw{margin:12px 0;border-radius:12px;border:1px solid #e8edf9;overflow-x:auto;background:#fff}
.gtw table.knowledge-table{width:auto;min-width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px;line-height:1.65}
.gtw table.knowledge-table th{background:linear-gradient(180deg,#f4f7ff,#eef2fe);color:#2b3a5c;
  font-weight:700;font-size:12px;text-align:left;padding:8px 10px;white-space:nowrap;border-bottom:1px solid #e2e9f9}
.gtw table.knowledge-table td{padding:8px 10px;vertical-align:top;color:#3b465e;border-bottom:1px solid #f1f4fb}
.gtw table.knowledge-table tbody tr:nth-child(even) td{background:#fafbff}
.gtw table.knowledge-table tbody tr:last-child td{border-bottom:none}
.gtw table.knowledge-table th:first-child,
.gtw table.knowledge-table td:first-child{white-space:nowrap;min-width:46px}
.gtw table.knowledge-table.w1 th:first-child,
.gtw table.knowledge-table.w1 td:first-child{white-space:normal;min-width:84px}
.gtw table.knowledge-table td b{color:#141d33;font-weight:700}
/* 口诀速查：首列是整句口诀，允许折行，否则会顶到右侧列 */
.gtw table.kjt th:first-child,
.gtw table.kjt td:first-child{white-space:normal;min-width:88px;width:36%}
.gtw table.kjt td:first-child b{font-weight:800;color:#a8490c;letter-spacing:.4px}
.gtw::-webkit-scrollbar{height:5px}
.gtw::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.ghint{font-size:10.5px;color:var(--txt3);text-align:right;margin:-4px 2px 10px}
/* 先导卡插图：base64 内嵌，自适应窄屏，长图限高避免一屏装不下 */
.gimg{margin:12px 0 10px;border-radius:11px;overflow:hidden;border:1px solid var(--line);background:#fff}
.gimg img{display:block;width:100%;height:auto;max-height:440px;object-fit:contain;object-position:top center;background:#fff}
.gimgcap{font-size:11.5px;line-height:1.55;color:var(--txt3);padding:7px 10px 9px;text-align:left;border-top:1px solid var(--line)}
.gfoot{display:flex;gap:8px;margin:14px 0 0}
.gfoot .btn{flex:1 1 0;min-width:0;padding:11px 8px;font-size:13px}
.gstart{width:100%;margin-top:10px;padding:13px}

/* ---------- 答题历史 ---------- */
.hrow{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:11px;background:var(--card2);margin-bottom:8px;cursor:pointer;transition:.12s}
.hrow:active{background:var(--pri-l)}
.hrow .hmain{flex:1;min-width:0}
.hrow .ht{font-size:13px;font-weight:600;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow .hs{font-size:11px;color:var(--txt3);margin-top:3px;font-variant-numeric:tabular-nums}
.hrow .hp{flex:0 0 auto;text-align:right}
.hrow .hp b{display:block;font-size:16px;font-weight:700;color:var(--pri);font-variant-numeric:tabular-nums}
.hrow .hp span{font-size:10px;color:var(--txt3)}
.hrow .arw{flex:0 0 auto;color:var(--txt3);font-size:12px}
.hhead{background:var(--pri-l);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.hhead .hh1{font-size:13px;font-weight:700;color:var(--pri);margin-bottom:6px}
.hhead .hh2{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--txt2)}
.hhead .hh2 b{color:var(--txt);font-variant-numeric:tabular-nums}
.hfilter{display:flex;gap:8px;margin-bottom:12px}
.hfilter button{flex:1;padding:8px;border:1.5px solid var(--line);border-radius:9px;background:var(--card);color:var(--txt2);font-family:inherit;font-size:12.5px;cursor:pointer}

.hitem{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:9px;background:var(--card2);margin-bottom:6px;font-size:12.5px}
.hitem .hn{flex:0 0 34px;color:var(--txt3);font-variant-numeric:tabular-nums}
.hitem .hq{flex:1;min-width:0;color:var(--txt2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hitem .ha{flex:0 0 auto;font-weight:700;font-variant-numeric:tabular-nums}
.hitem .ha .my{color:var(--no)}

.srow{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:9px;cursor:pointer;transition:.12s}
.srow:active{background:var(--pri-l)}
.srow .snm{flex:1;min-width:0;font-size:12.5px;color:var(--txt2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .scnt{font-size:11px;color:var(--txt3);flex:0 0 auto;font-variant-numeric:tabular-nums}
.srow .sbar{flex:0 0 46px;height:4px;background:var(--line);border-radius:3px;overflow:hidden}
.srow .sbar b{display:block;height:100%;background:var(--pri);border-radius:3px}

/* ---------- 填空题 ---------- */
.ttype.fill{background:#fff1e6;color:#c76a00}
.fillbox{border:1.5px dashed var(--line);border-radius:11px;padding:14px;background:var(--card2);margin-top:14px}
.fillbox.on{border-style:solid;border-color:var(--pri);background:var(--pri-l)}
.fillbox .fkt{font-size:13px;color:var(--txt3);line-height:1.7}
.fillbox .fkb{font-size:11px;color:var(--pri);font-weight:700;letter-spacing:.5px;margin-bottom:4px}
.fillbox .fkv{font-size:15px;font-weight:600;color:var(--txt);line-height:1.7;word-break:break-word}

/* ---------- 小节分隔条 ---------- */
.secbar{display:flex;align-items:center;gap:8px;margin:2px 2px 12px;font-size:12px;color:var(--txt2);font-weight:600}

.secbar .sn{background:var(--pri);color:#fff;border-radius:6px;padding:1px 6px;font-size:11px}

/* ---------- 桌面端：选项间距放宽，鼠标操作更舒适 ----------
   命中条件（任一）：视口 ≥600px，或设备带精确指针（鼠标/触控板）。
   手机（窄 + pointer:coarse）不受影响。 */
@media (min-width:600px), (hover:hover) and (pointer:fine){
  .opts{margin-top:22px}
  .opt{padding:16px 18px;margin-bottom:14px;gap:13px;border-radius:12px}
  .opt .k{width:26px;height:26px;font-size:13px}
  .opts .opt:last-child{margin-bottom:0}
}

<body>
<div id="app">
  <div id="topbar" class="topbar"></div>
  <div id="page" class="page"></div>
  <div id="nav" class="nav hide">
    <button data-tab="home"><span class="ic">🏠</span>主页</button>
    <button data-tab="search"><span class="ic">🔍</span>搜索</button>
    <button data-tab="wrong"><span class="ic">📕</span>错题本<span class="dot" id="dotWrong"></span></button>
    <button data-tab="fav"><span class="ic">⭐</span>收藏</button>
    <button data-tab="stat"><span class="ic">📊</span>统计</button>
  </div>
</div>
<div id="mask" class="mask"></div>
<div id="sheet" class="sheet"></div>
<div id="dlgMask" class="dlg-mask"><div class="dlg" id="dlg"></div></div>
<div id="toast" class="toast"></div>
<input type="file" id="fileIn" accept=".json,application/json" class="hide">

<script>
var DATA = /*__DATA__*/;
var ANALYSIS_DATA = /*__ANALYSIS__*/;
var GUIDE_DATA = /*__GUIDE__*/;

/* ================= 存储层 ================= */
/* 详细解析：优先使用文件内联的解析表（gen.py 注入），否则挂到 localStorage 缓存上 */
var ANALYSIS = (typeof ANALYSIS_DATA !== 'undefined') ? ANALYSIS_DATA : {};
try {
  if (!Object.keys(ANALYSIS).length) {
    const _raw = localStorage.getItem('__NS___v1_analysis');
    if (_raw) {
      const _o = JSON.parse(_raw);
      if (_o && _o.ver === 1 && _o.map) ANALYSIS = _o.map;
    }
  }
} catch(e){}
function getAna(cn, n){ return ANALYSIS[cn + '#' + n] || ''; }
function hasAna(cn, n){ return !!ANALYSIS[cn + '#' + n]; }

const LS = {
  P:'__NS___v1_progress', WP:'__NS___v1_wrong_pending', WA:'__NS___v1_wrong_all',
  F:'__NS___v1_favorites', S:'__NS___v1_settings', R:'__NS___v1_round', M:'__NS___v1_mastered',
  AN:'__NS___v1_analysis', Q:'__NS___v1_search', X:'__NS___v1_home_expand', H:'__NS___v1_history',
  G:'__NS___v1_guide'
};
const rd = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } };
const wr = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){ toast('存储失败：空间不足'); } };

let PROGRESS = rd(LS.P, {});      // { "章号": {idx, ans:{题号:"A"}, chk:{题号:true}} }
let WRONG_P  = rd(LS.WP, {});     // 待攻克 { "章号#题号": true }
let WRONG_A  = rd(LS.WA, {});     // 全部错题 { "章号#题号": true }
let FAV      = rd(LS.F, {});      // 收藏 { "章号#题号": true 或 时间戳 }
let SET      = Object.assign({fs:16, roundN:20, roundOn:true}, rd(LS.S, {}));
let ROUND    = rd(LS.R, null);    // 本轮刷题记录
let MASTERED = rd(LS.M, {});      // 已掌握标记 { "章号#题号": true }
let HIST     = rd(LS.H, {});      // 答题历史 { "章号": [ {at,total,done,correct,acc,ans:{题号:"A"}} ] }（新→旧，每章最多 5 条）
let GK       = rd(LS.G, {});      // 先导知识背诵勾选 { "章号|小节序号|块序号|序号": true }

const saveP = () => wr(LS.P, PROGRESS);
const saveWP = () => wr(LS.WP, WRONG_P);
const saveWA = () => wr(LS.WA, WRONG_A);
const saveF  = () => wr(LS.F, FAV);
const saveS  = () => wr(LS.S, SET);
const saveR  = () => wr(LS.R, ROUND);
const saveM  = () => wr(LS.M, MASTERED);
const saveH  = () => wr(LS.H, HIST);
const saveGK = () => wr(LS.G, GK);

let EXP = rd(LS.X, {});          // 首页章卡小节列表展开状态 { 章号: 1 }
const saveExp = () => wr(LS.X, EXP);

/* 展开 / 收起章卡内的小节列表 */
function setExpanded(card, on){
  if (!card) return;
  card.classList.toggle('open', on);
  const btn = card.querySelector('.stog');
  if (btn){
    btn.setAttribute('aria-expanded', on ? 'true' : 'false');
    const t = btn.querySelector('.stx');
    if (t) t.textContent = on ? '收起小节' : (btn.dataset.label || '展开小节');
  }
  EXP[card.dataset.cn] = on ? 1 : 0;
  saveExp();
}

/* 收藏是否已收藏（兼容 true 与时间戳两种存量格式） */
const isFav = k => !!FAV[k];
/* 收藏时间（用于章内排序；无数值则排最后） */
const favTime = k => { const v = FAV[k]; return typeof v === 'number' ? v : 0; };

/* ================= 工具 ================= */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const key = (cn, n) => cn + '#' + n;
const TYPE_CLS = t => t === '判断题' ? 'jud' : (t === '不定项选择' ? 'mul' : (t === '填空题' ? 'fill' : ''));

let toastT = null;
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 1600);
}

/* 由 key 反查题目 */
function findQ(cn, n){
  const c = DATA.chapters.find(x => x.no === cn);
  if (!c) return null;
  const q = c.qs.find(x => x.n === n);
  return q ? { ch:c, q } : null;
}
function keysOf(obj){ return Object.keys(obj).filter(k => obj[k]); }

/* ================= 状态 ================= */
let TAB = 'home';
let HIST_CUR = { cn:0, at:0, wrongOnly:false };   // 历史页定位：cn 章号；at>0 表示看某次明细
let VIEW = null;   // {mode:'chapter'|'wrong'|'fav'|'round'|'review', cn, title, list:[{cn,n}], idx, ans:{}, checked:{}}
let WRONG_TAB = 'pending';  // pending | all
let WRONG_OPEN = new Set(); // 错题本已展开的章号（默认全收起）
let FAV_OPEN = new Set();   // 收藏夹已展开的章号（默认全收起）

/* ================= 题目搜索状态 ================= */
/* kw 关键词 / cn 章号(0=全部) / type 题型(''=全部) / scope 命中范围 / st 状态筛选 / limit 已显示条数 */
let SEARCH = Object.assign(
  {kw:'', cn:0, type:'', scope:{s:1, o:1, a:1}, st:'', limit:60, focus:false},
  rd(LS.Q, {})
);
SEARCH.scope = Object.assign({s:0, o:0, a:0}, SEARCH.scope || {});
if (!SEARCH.scope.s && !SEARCH.scope.o && !SEARCH.scope.a) SEARCH.scope = {s:1, o:1, a:1};
const saveQ = () => wr(LS.Q, {kw:SEARCH.kw, cn:SEARCH.cn, type:SEARCH.type, scope:SEARCH.scope, st:SEARCH.st});
let _lastRes = [];          // 上一次搜索命中的题目（供速览/收藏联动）
let _sIdx = null;           // 搜索索引（首次搜索时构建）

/* ================= 顶栏渲染 ================= */
function renderTop(){
  const tb = $('topbar');
  if (VIEW) { tb.classList.add('hide'); return; }
  tb.classList.remove('hide');
  if (TAB === 'home') {
    const st = globalStat();
    tb.innerHTML = `
      <div class="tb-row">
        <div>
          <h1>${esc(DATA.name)}</h1>
          <div class="sub">${esc(DATA.subtitle)} · 共 ${DATA.total} 题 / ${DATA.chapterCount} 章 / ${DATA.secCount} 节</div>
        </div>
        <button class="tb-btn" id="btnSearch" title="搜索题目">🔍</button>
        <button class="tb-btn" id="btnSet" title="设置">⚙</button>
      </div>
      <div class="ov">
        <div class="it"><b>${st.done}</b><span>已做</span></div>
        <div class="it"><b>${st.acc}%</b><span>正确率</span></div>
        <div class="it"><b>${st.wrongP}</b><span>待攻克</span></div>
        <div class="it"><b>${st.fav}</b><span>收藏</span></div>
      </div>`;
    $('btnSet').onclick = () => { TAB = 'set'; render(); };
    $('btnSearch').onclick = () => { TAB = 'search'; SEARCH.focus = true; render(); };
  } else {
    const tt = {search:'🔍 题目搜索', wrong:'📕 错题本', fav:'⭐ 我的收藏', stat:'📊 学习统计', set:'⚙ 设置', hist:'📋 答题历史', guide:'📖 先导知识'}[TAB] || '';
    tb.innerHTML = `
      <div class="tb-row">
        <button class="tb-btn" id="btnBack">‹</button>
        <h1 style="flex:1;text-align:center">${tt}</h1>
        <button class="tb-btn" id="btnSet2">⚙</button>
      </div>`;
    $('btnBack').onclick = () => {
      // 历史明细 → 历史列表 → 首页
      if (TAB === 'hist' && HIST_CUR.at) { HIST_CUR.at = 0; render(); return; }
      TAB = 'home'; render();
    };
    $('btnSet2').onclick = () => { TAB = 'set'; render(); };
  }
}

/* ================= 统计 ================= */
function chapStat(c){
  const p = PROGRESS[c.no] || {};
  const ans = p.ans || {};
  let correct = 0, done = 0;
  c.qs.forEach(q => {
    const a = ans[q.n];
    if (a !== undefined) { done++; if (a === q.a) correct++; }
  });
  return { done, total:c.qs.length, correct, acc: done ? Math.round(correct / done * 100) : 0, pct: Math.round(done / c.qs.length * 100) };
}
function globalStat(){
  let done = 0, correct = 0, total = 0;
  DATA.chapters.forEach(c => { const s = chapStat(c); done += s.done; correct += s.correct; total += s.total; });
  return {
    done, correct, total,
    acc: done ? Math.round(correct / done * 100) : 0,
    wrongP: keysOf(WRONG_P).length,
    wrongA: keysOf(WRONG_A).length,
    fav: keysOf(FAV).length
  };
}

/* 章内小节：按 q.sec 分组统计 */
function secsOf(c){
  const ans = (PROGRESS[c.no] || {}).ans || {};
  const map = new Map();
  c.qs.forEach(q => {
    const k = q.sec || '本节';
    if (!map.has(k)) map.set(k, { name:k, total:0, done:0, correct:0 });
    const o = map.get(k);
    o.total++;
    if (ans[q.n] !== undefined) { o.done++; if (ans[q.n] === q.a) o.correct++; }
  });
  return [...map.values()].map(o => Object.assign(o, { pct: o.total ? Math.round(o.done / o.total * 100) : 0 }));
}

/* ================= 答题历史（章级快照） ================= */
const HIST_MAX = 5;              // 每章最多保留 5 次

/** 取某章当前答题进度快照；没有任何作答则返回 null */
function snapOf(cn){
  const c = DATA.chapters.find(x => x.no === cn);
  if (!c) return null;
  const p = PROGRESS[cn] || {};
  const ans = p.ans || {};
  const out = {};
  let done = 0, correct = 0;
  c.qs.forEach(q => {
    const a = ans[q.n];
    if (a === undefined) return;
    out[q.n] = a;
    done++;
    if (a === q.a) correct++;
  });
  if (!done) return null;
  return { at:Date.now(), total:c.qs.length, done, correct,
           acc: done ? Math.round(correct / done * 100) : 0, ans:out };
}

/** 把当前进度存进历史（新→旧，最多 HIST_MAX 条） */
function archiveChapter(cn){
  const s = snapOf(cn);
  if (!s) return null;
  const arr = HIST[cn] || [];
  arr.unshift(s);
  HIST[cn] = arr.slice(0, HIST_MAX);
  saveH();
  return s;
}
const histOf = cn => (HIST[cn] || []);
const histCount = cn => histOf(cn).length;
function histTotal(){ return DATA.chapters.reduce((n, c) => n + histCount(c.no), 0); }

/* 重做本章：先把当前记录归档，再清空本章进度（错题本、收藏不动） */
function redoChapter(cn){
  const c = DATA.chapters.find(x => x.no === cn);
  if (!c) return;
  const s = chapStat(c);
  if (!s.done) { startStudy('chapter', cn); return; }
  dialog('重做本章',
    `本章《${esc(c.name)}》已作答 <b>${s.done}/${s.total}</b> 题，正确率 <b>${s.acc}%</b>。<br><br>` +
    `重做会先把这次记录<b>存入历史</b>（当前共 ${histCount(cn)} 次，最多保留 ${HIST_MAX} 次），` +
    `再清空本章答题进度。<br><br>` +
    `<b>错题本与收藏不会被清除。</b>`,
    () => {
      archiveChapter(cn);
      // 清空本章进度
      PROGRESS[cn] = { idx:0, ans:{}, chk:{} };
      saveP();
      // 本章在本轮刷题里的作答一并清掉，避免出现「做过但没记录」的错位
      if (ROUND && ROUND.ans){
        Object.keys(ROUND.ans).forEach(k => {
          if (+k.split('#')[0] === cn) { delete ROUND.ans[k]; if (ROUND.chk) delete ROUND.chk[k]; }
        });
        ROUND.idx = 0;
        saveR();
      }
      if (VIEW && VIEW.cn === cn) VIEW = null;
      invalidateSeq();
      toast('已存入历史，本章进度已清空');
      startStudy('chapter', cn);
    }, '确认重做');
}

/** 打开某章历史列表 */
function openHist(cn){
  HIST_CUR = { cn: +cn, at: 0, wrongOnly: false };
  TAB = 'hist';
  render();
}

/* 答题历史页：at=0 显示快照列表，否则显示某次明细 */
function viewHist(){
  const cn = HIST_CUR.cn;
  const c = DATA.chapters.find(x => x.no === cn);
  if (!c) { TAB = 'home'; return ''; }
  const list = histOf(cn);

  if (!HIST_CUR.at){
    if (!list.length){
      return `<div class="stat-card">
        <h4>📋 第 ${c.no} 章 · ${esc(c.name)}</h4>
        <div class="hempty">本章还没有历史记录。<br>在首页点章卡上的「重做本章」，<br>当前这次答题就会被存进这里。</div>
      </div>`;
    }
    return `<div class="stat-card">
      <h4>📋 第 ${c.no} 章 · ${esc(c.name)} · ${list.length} 次</h4>
      <div class="sub" style="font-size:11.5px;color:var(--txt3);margin:-4px 0 10px">点击查看逐题明细，最多保留最近 ${HIST_MAX} 次</div>
      ${list.map((s, i) => `
        <div class="hrow" data-hsnap="${s.at}">
          <div class="hmain">
            <div class="ht">${fmtTime(s.at)}${i === 0 ? ' · 最近一次' : ''}</div>
            <div class="hs">作答 ${s.done}/${s.total} 题 · 答对 ${s.correct} 题</div>
          </div>
          <div class="hp"><b>${s.acc}%</b><span>正确率</span></div>
          <span class="arw">›</span>
        </div>`).join('')}
    </div>`;
  }

  const s = list.find(x => x.at === HIST_CUR.at);
  if (!s){
    return `<div class="stat-card"><div class="hempty">该记录已不存在</div></div>`;
  }
  const rows = c.qs.map(q => {
    const my = s.ans[q.n];
    if (my === undefined) return null;
    return { q, my, ok: my === q.a };
  }).filter(Boolean);
  const wrongRows = rows.filter(r => !r.ok);
  const show = HIST_CUR.wrongOnly ? wrongRows : rows;
  const unanswered = s.total - s.done;

  return `
    <div class="hhead">
      <div class="hh1">${fmtTime(s.at)}</div>
      <div class="hh2">
        <span>作答 <b>${s.done}</b>/${s.total}</span>
        <span>答对 <b>${s.correct}</b></span>
        <span>答错 <b>${rows.length - s.correct}</b></span>
        <span>正确率 <b>${s.acc}%</b></span>
        ${unanswered > 0 ? `<span>未作答 <b>${unanswered}</b></span>` : ''}
      </div>
    </div>
    <div class="hfilter">
      <button class="${HIST_CUR.wrongOnly ? '' : 'on'}" data-hwrong="0">全部 ${rows.length} 题</button>
      <button class="${HIST_CUR.wrongOnly ? 'on' : ''}" data-hwrong="1">只看错题 ${wrongRows.length} 题</button>
    </div>
    ${show.length ? show.map(r => `

/** 题干摘要：折叠空白（保留（）等原有标记，长度交给 CSS 省略号处理） */
function stripQ(s){
  return String(s || '').replace(/\s+/g, ' ').trim();
}
/** 时间显示：今天内只显示时分，其余带日期 */
function fmtTime(ts){
  const d = new Date(ts), n = new Date();
  const hm = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  const sameDay = d.getFullYear() === n.getFullYear() && d.getMonth() === n.getMonth() && d.getDate() === n.getDate();
  const md = `${d.getMonth()+1}月${d.getDate()}日`;
  return sameDay ? `今天 ${hm}` : `${md} ${hm}`;
}

/* 表格最小宽度：中文按每字 12.5px 估，最短给 52px，最长给 200px；
   合计超过 360px 才设 min-width（否则让它自然铺满）。这样 3~4 列的长表不会挤成一字一行。 */
function tableMinWidth(b){
  const head = b.head || [], rows = b.rows || [];
  // 3 列以内让浏览器自然压缩（换行仍可读）；4 列以上信息太密，给最小宽度转横向滚动
  if (head.length < 4) return 0;
  let total = 0;
  head.forEach((h, i) => {
    let m = String(h).replace(/<[^>]+>/g, '').length;
    rows.forEach(r => {
      const v = String((r && r[i] != null) ? r[i] : '').replace(/<[^>]+>/g, '');
      if (v.length > m) m = v.length;
    });
    total += Math.max(52, Math.min(200, Math.round(m * 12.5)));
  });
  return Math.max(400, Math.min(520, total));
}

function gBlock(b){
  const k = b.k;
  if (k === 'h')  return `<h3 class="gh">${b.t}</h3>`;
  if (k === 'p')  return `<p class="gp">${b.t}</p>`;
  if (k === 'tip') return `<div class="tip">${b.t}</div>`;
  if (k === 'ul') return '<ul class="gul">' + (b.items || []).map(t => `<li>${t}</li>`).join('') + '</ul>';
  if (k === 'kj') return `<div class="gkj"><div class="gkh"><span class="gktag">口诀</span><span class="gkc">${esc(b.c)}</span></div><div class="gkd">${b.d}</div></div>`;
  if (k === 'img') {
    const cap = b.cap ? `<figcaption class="gimgcap">${b.cap}</figcaption>` : '';
    return `<figure class="gimg"><img src="${b.src || ''}" alt="${esc(b.alt || '')}" loading="lazy">${cap}</figure>`;
  }
  if (k === 'table') {
    const head = (b.head || []).map(h => `<th>${h}</th>`).join('');
    const rows = (b.rows || []).map(r => '<tr>' + r.map(c => `<td>${c}</td>`).join('') + '</tr>').join('');
    // 按「最长单元格字数」估一个最小宽度：窄屏放不下就横向滚动，而不是把长列挤成两三个字一行
    const mw = tableMinWidth(b);
    const style = mw ? ` style="min-width:${mw}px"` : '';
    // 首列标签太长时（如「动作记忆（运动记忆）」），nowrap 会把整表顶宽、后面的列被挤成两三个字
    const lead = Math.max(...(b.rows || []).map(r => String((r && r[0]) || '').replace(/<[^>]+>/g, '').length), 0);
    const cls = lead > 8 ? ' w1' : '';
    return `<div class="gtw"><table class="knowledge-table${cls}"${style}><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table></div>`;
  }
  return '';
}

function wrongKeys(tab, cn){
  const obj = tab === 'pending' ? WRONG_P : WRONG_A;
  let ks = keysOf(obj).map(k => { const [a, b] = k.split('#'); return { cn:+a, n:+b }; })
    .filter(x => findQ(x.cn, x.n));
  if (cn != null) ks = ks.filter(x => x.cn === cn);
  return ks;
}

/** 把一组题按章分组 → [{cn, name, items:[{cn,n}], total}]，空章不返回 */
function groupByChapter(items){
  const map = new Map();
  items.forEach(it => {
    if (!map.has(it.cn)) map.set(it.cn, []);
    map.get(it.cn).push(it);
  });
  const out = [];
  DATA.chapters.forEach(c => {          // 按章号顺序输出
    const arr = map.get(c.no);
    if (!arr || !arr.length) return;
    out.push({ cn:c.no, name:c.name, items:arr, total:arr.length });
  });
  return out;
}

const HOT_KW = ['数据标注', '数据清洗', '卷积', '分类', 'SQL', '隐私'];

/* 解析是 HTML，检索前先剥标签转纯文本 */
function plainAna(h){
  return String(h || '').replace(/<[^>]*>/g, ' ').replace(/&nbsp;/g, ' ')
    .replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>')
    // 四段式固定小标题不算正文：否则搜「记忆」会把每一道题的「记忆口诀」标题都算命中
    .replace(/(?:🎯|📚|💡|🧠)\s*(?:答案解析|知识点讲解|解题思路|记忆口诀)/g, ' ')
    .replace(/\s+/g, ' ').trim();
}

/* 全库检索索引：首次搜索时惰性构建，之后复用 */
function searchIndex(){

    const optTxt = Object.keys(q.o).map(l => q.o[l]).join(' ');
    const anaTxt = plainAna(getAna(c.no, q.n));
    out.push({
      cn:c.no, n:q.n, t:q.t, s:q.s, opt:optTxt, ana:anaTxt,
      ls:q.s.toLowerCase(), lo:optTxt.toLowerCase(), la:anaTxt.toLowerCase()
    });
  }));
  _sIdx = out;
  return out;
}

/* 关键词高亮：原样文本传入，内部先转义再包 <mark>（多关键词取并集、区间去重叠） */
function markKw(text, tokens){
  const t = esc(text);
  if (!tokens || !tokens.length) return t;
  const low = t.toLowerCase();
  const ranges = [];
  tokens.forEach(tk => {
    if (!tk) return;
    let i = low.indexOf(tk);
    while (i >= 0) { ranges.push([i, i + tk.length]); i = low.indexOf(tk, i + tk.length); }
  });
  if (!ranges.length) return t;
  ranges.sort((a, b) => a[0] - b[0]);
  const merged = [];
  ranges.forEach(r => {
    const last = merged[merged.length - 1];
    if (last && r[0] <= last[1]) last[1] = Math.max(last[1], r[1]);
    else merged.push(r.slice());
  });
  let out = '', pos = 0;
  merged.forEach(r => {
    out += t.slice(pos, r[0]) + '<mark class="kw">' + t.slice(r[0], r[1]) + '</mark>';
    pos = r[1];
  });
  return out + t.slice(pos);
}

/* 命中片段：取关键词前后 pad 个字，并向两侧就近对齐到句读，避免半句开头 */
function snipKw(text, tokens, pad){
  const s = String(text || '').replace(/\s+/g, ' ').trim();
  if (!s) return '';
  const low = s.toLowerCase();
  let at = -1, len = 0;
  tokens.forEach(tk => {
    if (!tk) return;
    const i = low.indexOf(tk);
    if (i >= 0 && (at < 0 || i < at)) { at = i; len = tk.length; }
  });
  if (at < 0) return esc(s.slice(0, 80));
  const p = pad || 26;
  let a = Math.max(0, at - p), b = Math.min(s.length, at + len + p);
  const SEP = '。；！？，、';
  for (let i = at - 1; i >= a; i--) { if (SEP.indexOf(s[i]) >= 0) { a = i + 1; break; } }
  for (let i = at + len; i < Math.min(s.length, b + 12); i++) { if (SEP.indexOf(s[i]) >= 0) { b = i + 1; break; } }
  return (a > 0 ? '…' : '') + markKw(s.slice(a, b).trim(), tokens) + (b < s.length ? '…' : '');
}

/* 检索：多关键词空格分隔 = 与逻辑（每个词都要命中，范围可分布在题干/选项/解析） */
function doSearch(){
  const kw = (SEARCH.kw || '').trim();
  const tokens = kw.toLowerCase().split(/\s+/).filter(Boolean);
  if (!tokens.length) return { items:[], tokens:[] };

  const sc = SEARCH.scope, st = SEARCH.st;
  const res = [];
  searchIndex().forEach(it => {
    if (SEARCH.cn && it.cn !== SEARCH.cn) return;
    if (SEARCH.type && it.t !== SEARCH.type) return;

    if (st) {
      const k = key(it.cn, it.n);
      const my = ((PROGRESS[it.cn] || {}).ans || {})[it.n];
      if (st === 'undone' && my !== undefined) return;
      if (st === 'done' && my === undefined) return;
      if (st === 'wrong' && !WRONG_A[k]) return;
      if (st === 'fav' && !FAV[k]) return;
    }

    let hit = '';
    for (let i = 0; i < tokens.length; i++) {
      const tk = tokens[i];
      const inS = !!sc.s && it.ls.indexOf(tk) >= 0;
      const inO = !inS && !!sc.o && it.lo.indexOf(tk) >= 0;
      const inA = !inS && !inO && !!sc.a && it.la.indexOf(tk) >= 0;
      if (!inS && !inO && !inA) return;          // 有任一关键词未命中 → 剔除
      if (!hit) hit = inS ? 's' : (inO ? 'o' : 'a');
    }
    res.push({ cn:it.cn, n:it.n, t:it.t, s:it.s, opt:it.opt, ana:it.ana, hit:hit });
  });
  // 题干命中优先，其次按章号 / 章内题号
  res.sort((a, b) => (a.hit === 's' ? 0 : 1) - (b.hit === 's' ? 0 : 1) || a.cn - b.cn || a.n - b.n);
  return { items:res, tokens };
}

/* 单条结果 */
function resRow(it, tokens){
  const f = findQ(it.cn, it.n);
  if (!f) return '';
  const q = f.q, k = key(it.cn, it.n);
  const my = ((PROGRESS[it.cn] || {}).ans || {})[q.n];
  const stTag = my === undefined ? '<span>未做</span>'
    : (my === q.a ? '<span style="color:var(--ok)">✓ 已答对</span>'
                  : '<span style="color:var(--no)">✗ 答错</span>');
  let snip = '';
  if (it.hit === 'o') snip = `<div class="snip">选项命中：${snipKw(it.opt, tokens, 22)}</div>`;
  else if (it.hit === 'a') snip = `<div class="snip">解析命中：${snipKw(it.ana, tokens, 26)}</div>`;
  return `<div class="res" data-res="${it.cn}#${it.n}">
    <div class="rh">
      <span class="cn">第${it.cn}章</span>
      <span>第 ${q.n} 题</span>
      <span>${esc(q.t)}</span>
      <button class="st ${isFav(k) ? 'on' : ''}" data-sfav="${it.cn}#${it.n}" title="收藏">${isFav(k) ? '★' : '☆'}</button>
    </div>
    <div class="stem2">${markKw(q.s, tokens)}</div>
    ${snip}
    <div class="mt">${stTag}<span class="ans">答案 ${esc(q.r || q.a)}</span></div>
  </div>`;
}

/* 结果区 HTML（含「速览整批」与分页加载） */
function resultsHtml(r){
  const items = r.items, tokens = r.tokens;
  if (!items.length) {
    _lastRes = [];
    return `<div class="empty"><div class="ic">🔍</div><p>没有找到匹配的题目</p>
      <p style="font-size:12px">可试试：减少关键词、切换「范围」或改回「全部章节」</p></div>`;
  }
  _lastRes = items;
  const show = items.slice(0, SEARCH.limit);
  let h = `<div class="li-act" style="margin-bottom:10px">
      <button class="btn pri" data-act="studyRes">按顺序速览这 ${items.length} 题</button>
    </div>

  }
  return h;
}

/* 打开速览（i = 结果下标） */
function openLookup(i){
  if (!_lastRes || !_lastRes.length) { toast('没有可速览的题目'); return; }
  const list = _lastRes.map(x => ({ cn:x.cn, n:x.n }));
  VIEW = {

    title:'搜索「' + (SEARCH.kw || '').trim() + '」· ' + list.length + ' 题',

/* 搜索页事件绑定 */
function bindSearch(){
  const inp = $('qInput');
  if (!inp) return;
  let tmr = null;
  const sync = () => {
    SEARCH.kw = inp.value;
    SEARCH.limit = 60;
    const clr = $('qClear');
    if (clr) clr.style.display = SEARCH.kw ? '' : 'none';
    saveQ();
    updateResults();
  };
  inp.addEventListener('input', () => { clearTimeout(tmr); tmr = setTimeout(sync, 180); });
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); clearTimeout(tmr); sync(); inp.blur(); }
    else if (e.key === 'Escape') { inp.value = ''; clearTimeout(tmr); sync(); }
  });
  const clr = $('qClear');
  if (clr) clr.onclick = () => { inp.value = ''; sync(); inp.focus(); };

  const chap = $('qChap');
  if (chap) chap.onchange = () => { SEARCH.cn = +chap.value || 0; SEARCH.limit = 60; saveQ(); updateResults(); };

  const typeBox = $('qType');
  if (typeBox) typeBox.querySelectorAll('button[data-type]').forEach(b => {
    b.onclick = () => {
      SEARCH.type = b.dataset.type || ''; SEARCH.limit = 60; saveQ();
      typeBox.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
      updateResults();
    };
  });
  const scopeBox = $('qScope');
  if (scopeBox) scopeBox.querySelectorAll('button[data-scope]').forEach(b => {
    b.onclick = () => {
      const s = b.dataset.scope;
      const willOn = !SEARCH.scope[s];
      const others = ['s', 'o', 'a'].filter(x => x !== s && SEARCH.scope[x]).length;
      if (!willOn && !others) { toast('至少保留一个搜索范围'); return; }
      SEARCH.scope[s] = willOn ? 1 : 0;
      b.classList.toggle('on', willOn);
      SEARCH.limit = 60; saveQ(); updateResults();
    };
  });
  const stBox = $('qSt');
  if (stBox) stBox.querySelectorAll('button[data-st]').forEach(b => {
    b.onclick = () => {
      SEARCH.st = b.dataset.st || ''; SEARCH.limit = 60; saveQ();
      stBox.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
      updateResults();
    };
  });

  // 结果区委托：行点击 / 收藏 / 热词 / 加载更多 / 整批速览
  const box = $('resBox');
  if (box) box.addEventListener('click', e => {
    const sf = e.target.closest('[data-sfav]');
    if (sf) { e.stopPropagation(); toggleFavKey(sf.dataset.sfav); return; }
    const hot = e.target.closest('[data-hot]');
    if (hot) { inp.value = hot.dataset.hot; sync(); return; }
    if (e.target.closest('[data-act="moreRes"]')) { SEARCH.limit += 60; updateResults(); return; }
    if (e.target.closest('[data-act="studyRes"]')) { openLookup(0); return; }
    const row = e.target.closest('[data-res]');
    if (row) {
      const parts = row.dataset.res.split('#');
      const cn = +parts[0], n = +parts[1];
      let i = -1;
      _lastRes.forEach((x, j) => { if (x.cn === cn && x.n === n) i = j; });
      openLookup(i < 0 ? 0 : i);
    }
  });

  if (SEARCH.focus) {
    SEARCH.focus = false;
    setTimeout(() => { try { inp.focus(); } catch(_){} }, 60);
  }
  updateResults();
}
