/* ================= 刷题视图 ================= */
/** 本轮刷题功能是否开启（关闭后章节回归整章模式，首页也不显示本轮卡片） */
const roundOn = () => SET.roundOn !== false;

/** 章节模式出题范围：开关开启时只取「本章一段」题量，关闭时返回整章。
 *  起点 = 本章已做过的最大章内下标 +1（接着上次往下），到章末则回到章首。 */
function chapterSlice(cn){
  const c = DATA.chapters.find(x => x.no === cn);
  if (!c) return null;
  const all = c.qs.map(q => ({ cn, n:q.n }));
  if (!roundOn()) return { list: all, sliced:false, done:0 };

  const p = PROGRESS[cn] || {};
  const ans = p.ans || {};
  // 找本章最后一个已作答题目的下标
  let last = -1;
  c.qs.forEach((q, i) => { if (ans[q.n] !== undefined && i > last) last = i; });
  // 起点：紧接着上次；整章做完过（last 已到末位）则从头开始
  let start = last + 1;
  if (start >= all.length) start = 0;

  const want = Math.max(1, Math.min(SET.roundN || 20, all.length));
  const list = [];
  for (let i = 0; i < want; i++) list.push(all[(start + i) % all.length]);
  return { list, sliced:true, done:last + 1, start, total:all.length };
}

function buildList(mode, cn, sec){
  if (mode === 'chapter') {
    if (sec) {
      const c = DATA.chapters.find(x => x.no === cn);
      if (!c) return [];
      return c.qs.filter(q => q.sec === sec).map(q => ({ cn, n:q.n }));
    }
    const s = chapterSlice(cn);
    return s ? s.list : [];
  }
  if (mode === 'wrong') {
    // 支持限定章节（错题本按章练习）
    const ks = wrongKeys(WRONG_TAB, cn);
    return ks;
  }
  if (mode === 'fav') {
    // cn 为 null → 全部收藏；否则仅该章收藏
    let ks = keysOf(FAV).map(k => { const [a, b] = k.split('#'); return { cn:+a, n:+b }; });
    if (cn != null) ks = ks.filter(x => x.cn === cn);
    return ks.filter(x => findQ(x.cn, x.n));
  }
  if (mode === 'round') return (ROUND && ROUND.list) ? ROUND.list.slice() : [];
  return [];
}

/* ---------- 本轮刷题（按章节顺序，不抽题） ---------- */

/** 全库顺序题列表：章1题1…章1末、章2题1… */
function allSeq(){
  const out = [];
  DATA.chapters.forEach(c => c.qs.forEach(q => out.push({ cn:c.no, n:q.n })));
  return out;
}

/** 计算本轮应从全库第几题开始：
 *  接着上次的做题进度往后走；已到末尾则回到开头。 */
function nextRoundStart(){
  let cursor = 0;
  DATA.chapters.forEach(c => {
    const p = PROGRESS[c.no] || {};
    const ans = p.ans || {};
    c.qs.forEach((q, i) => {
      if (ans[q.n] !== undefined) {
        // 该题已做过，记录它的全库下标 +1 作为候选起点
        const idx = allSeqIdx(c.no, q.n);
        if (idx + 1 > cursor) cursor = idx + 1;
      }
    });
  });
  const seq = allSeq();
  if (cursor >= seq.length) cursor = 0;      // 已到末尾 → 从头再来
  return cursor;
}

/** 章号+题号 → 全库顺序下标（缓存加速） */
let _seqCache = null, _seqMap = null;
function allSeqIdx(cn, n){
  if (!_seqMap) {
    _seqCache = allSeq();
    _seqMap = {};
    _seqCache.forEach((it, i) => { _seqMap[key(it.cn, it.n)] = i; });
  }
  const v = _seqMap[key(cn, n)];
  return v === undefined ? -1 : v;
}
function invalidateSeq(){ _seqCache = null; _seqMap = null; }

/** 生成本轮题目：从 start 起按顺序连续取 n 题 */
function makeRound(n, startIdx){
  const seq = allSeq();
  const n2 = Math.max(1, Math.min(n, seq.length));
  const list = [];
  for (let i = 0; i < n2; i++) list.push(seq[(startIdx + i) % seq.length]);
  return list;
}

/** 开始新一轮 */
function startRound(n){
  const seq = allSeq();
  if (!seq.length) { toast('题库为空'); return; }
  const start = nextRoundStart();
  const want = Math.max(1, Math.min(n || SET.roundN || 20, seq.length));
  const list = makeRound(want, start);
  ROUND = {
    n: want,
    list,
    idx: 0,
    ans: {},
    checked: {},
    done: false,
    startIdx: start,
    startedAt: Date.now(),
    roundNo: (ROUND && ROUND.roundNo ? ROUND.roundNo : 0) + 1
  };
  saveR();
  // 进入本轮刷题视图
  VIEW = {
    mode:'round', cn:null, title:`第 ${ROUND.roundNo} 轮 · 共 ${list.length} 题`,
    list, idx:0, ans:{}, checked:{}, recite:false
  };
  render();
}

/** 继续未完成的本轮 */
function resumeRound(){
  if (!ROUND || !ROUND.list || !ROUND.list.length) { toast('没有进行中的轮次'); return; }
  VIEW = {
    mode:'round', cn:null, title:`第 ${ROUND.roundNo || 1} 轮 · 共 ${ROUND.list.length} 题（继续）`,
    list: ROUND.list.slice(), idx: ROUND.idx || 0,
    ans: Object.assign({}, ROUND.ans || {}),
    checked: Object.assign({}, ROUND.checked || {}),
    recite:false
  };
  render();
}

/** 本轮进度（已答/总） */
function roundProgress(){
  if (!ROUND || !ROUND.list) return null;
  const total = ROUND.list.length;
  const done = Object.keys(ROUND.checked || {}).length;
  return { done, total, pct: total ? Math.round(done / total * 100) : 0, finished: !!ROUND.done };
}

function startStudy(mode, cn, sec){
  const list = buildList(mode, cn, sec);
  if (!list.length) { toast('没有可练习的题目'); return; }
  const chName = (DATA.chapters.find(x => x.no === cn) || {}).name || '';
  const title = mode === 'chapter'
    ? (chName + (sec ? ' · ' + sec : ''))
    : (mode === 'wrong'
        ? ((WRONG_TAB === 'pending' ? '待攻克错题' : '全部错题') + (cn != null ? ' · 第' + cn + '章' : ''))
        : ('我的收藏' + (cn != null ? ' · 第' + cn + '章' : '')));
  VIEW = {
    mode, cn, sec, title, list, idx:0, ans:{}, checked:{}, reveal:{},
    recite: SET.recite && mode === 'chapter' ? true : false
  };
  if (mode === 'chapter') {
    // 按题量截断时，本段是新的一组题（不一定和第 1 题对齐），
    // 不再套用整章式「从 idx 接着做」——直接按已作答题数往后排。
    const sliced = sec ? false : roundOn();
    const p = PROGRESS[cn] || {};
    if (sliced) {
      const doneInSlice = list.filter(it => (p.ans || {})[it.n] !== undefined).length;
      VIEW.idx = doneInSlice < list.length ? doneInSlice : 0;
      VIEW.sliceInfo = { start: chapterSlice(cn).start, total: chapterSlice(cn).total };
    } else if (!VIEW.recite) {
      if (p.idx > 0 && p.idx < list.length) VIEW.idx = p.idx;
      if (p.ans) VIEW.ans = Object.assign({}, p.ans);
      if (p.chk) VIEW.checked = Object.assign({}, p.chk);
    } else {
      if (p.idx > 0 && p.idx < list.length) VIEW.idx = p.idx;
    }
  }
  render();
}

function curQ(){
  const it = VIEW.list[VIEW.idx];
  return it ? findQ(it.cn, it.n) : null;
}

function renderStudy(){
  if (!VIEW) return;
  const f = curQ();
  if (!f) { VIEW = null; TAB = 'home'; render(); return; }
  const { ch, q } = f;
  const total = VIEW.list.length;
  const k = key(ch.no, q.n);
  const myAns = VIEW.ans[q.n];
  const checked = !!VIEW.checked[q.n];
  const isRecite = VIEW.recite;
  const isLookup = VIEW.mode === 'lookup';      // 搜索结果速览：直接展示答案与解析
  const correctChars = q.a.split('');

  /* 题干 */
  let optsHtml = '';
  const optKeys = Object.keys(q.o);
  const multi = q.a.length > 1;

  // 选项渲染状态
  const selSet = new Set((myAns || '').split(''));
  const showAna = isRecite || isLookup || checked || VIEW.mode === 'review';

  const isFill = q.t === '填空题' || optKeys.length === 0;
  const revealed = isFill && (showAna || !!(VIEW.reveal && VIEW.reveal[q.n]));
  if (isFill) {
    optsHtml = `<div class="fillbox ${revealed ? 'on' : ''}">${
      revealed
        ? `<div class="fkb">参考答案</div><div class="fkv">${esc(q.r || '')}</div>`
        : `<div class="fkt">填空题 · 先在纸上写出答案，再点下方「看参考答案」核对</div>`
    }</div>`;
  }
  optKeys.forEach(letter => {
    let cls = 'opt';
    if (!showAna) {
      if (selSet.has(letter)) cls += ' sel';
    } else {
      const isRight = correctChars.includes(letter);
      const isMine = selSet.has(letter);
      if (isRight) cls += ' ok';
      else if (isMine) cls += ' no';
      else cls += ' dis';
    }
    if (showAna) cls += ' dis';
    optsHtml += `<div class="${cls}" data-letter="${letter}">
      <span class="k">${letter}</span>
      <span class="v">${esc(q.o[letter])}</span>
    </div>`;
  });

  /* 解析 */
  let anaHtml = '';
  if (showAna) {
    const ansText = isFill ? '' : q.a.split('').map(l => l + '. ' + (q.o[l] || '')).join('　');
    const isJud = q.t === '判断题';
    const isRight = myAns === q.a;
    const tone = (isRecite || isLookup) ? 'neutral' : (isRight ? 'right' : 'wrong');
    const hdTxt = isLookup ? '🔍 题目速览 · 答案与解析'
      : (isRecite ? '📖 背题模式 · 答案与解析'
        : (isRight ? '✅ 回答正确' : '❌ 回答错误'));
    let rows = '';
    if (!isRecite && !isLookup) {
      rows += `<div class="row ${isRight ? 'rt' : 'wn'}"><span class="lb">你的作答：</span><span class="tx">${isFill ? (isRight ? '自评答对' : '自评答错') : (myAns ? myAns.split('').map(l => l + '. ' + (q.o[l] || '')).join('；') : '未作答')}</span></div>`;
    }
    if (!isRight || isRecite || isLookup) {
      rows += `<div class="row rt"><span class="lb">正确答案：</span><span class="tx">${ansText}</span></div>`;
    }
    let extra = '';
    if (!isRight && !isRecite && !isLookup && myAns) {
      const wrongs = myAns.split('').filter(l => !correctChars.includes(l));
      if (wrongs.length) {
        extra = `<div class="row wn"><span class="lb">易混辨析：</span><span class="tx">${wrongs.map(l => `${l}. ${esc(q.o[l] || '')} —— 该选项不符合题意，是本题的干扰项`).join('；')}</span></div>`;
      }
    }
    /* 详细解析（有则用全文，无则用兜底模板） */
    const detail = getAna(ch.no, q.n);
    const judgeRight = q.t === '判断题' ? (q.a === 'A' ? '正确' : '错误') : '';
    const fallback = `本题属于「<b>${esc(q.t)}</b>」，考查知识点方向为「<span class="hl">${esc(ch.name)}</span>」。`
      + (isJud ? `判断题常以「绝对化表述」（一律、任何、都、必须）设坑，本题标准判断为「<span class="hl">${judgeRight}</span>」。` : '')
      + (myAns ? (isRight ? '你的作答与标准答案一致。' : '你的作答与标准答案不一致，注意区分上述干扰项与正确选项的差异。') : '')
      + `建议结合「${esc(ch.name)}」章节知识梳理该考点，加深印象。`;
    const anaBody = detail
      ? `<div class="analysis">${detail}</div>`
      : `<div class="row an"><span class="lb">📚 解析：</span><span class="tx">${fallback}</span></div>`;
    anaHtml = `<div class="ana ${tone}">
      <div class="hd">${hdTxt}</div>
      <div class="bd">
        ${isFill ? '' : `<div class="ansline ${isJud ? 'jud' : ''}">正确答案：<b>${esc(q.a)}</b>${!isJud ? '　' + ansText : ''}</div>`}
        <div class="ana-hd">${detail
          ? `<span class="lb" style="font-weight:600;color:var(--pri)">📚 详细解析</span><span class="src-tag detail">详细</span>`
          : `<span class="lb" style="font-weight:600;color:var(--pri)">📚 解析</span><span class="src-tag">基础</span>`}</div>
        ${rows}${extra}${anaBody}
      </div>
    </div>`;
  }

  const pct = Math.round((VIEW.idx + 1) / total * 100);
  const answeredCount = Object.keys(VIEW.checked).length;
  const isRound = VIEW.mode === 'round';
  const isReview = VIEW.mode === 'review';

  let h = `
  <div class="qhead">
    <div class="r1">
      <button class="back" data-act="exit">‹</button>
      <span class="ttl">${esc(VIEW.title)}</span>
      ${VIEW.mode === 'chapter' ? `<button class="mode-tag ${isRecite ? 'recite' : ''}" data-act="toggleRecite">${isRecite ? '背题模式' : '常规模式'}</button>` : ''}
      ${isLookup ? `<button class="mode-tag" data-act="chapterHere">去本章练习</button>` : ''}
      ${isReview ? `<span class="mode-tag" data-act="toWrongBoard">去错题本</span>` : ''}
    </div>
    <div class="r2">
      <span>第 ${VIEW.idx + 1} / ${total} 题</span>
      <span class="pbar"><i style="width:${pct}%"></i></span>
      <span>已答 ${answeredCount}</span>
    </div>
  </div>

  ${(() => {
    const prev = VIEW.idx > 0 ? VIEW.list[VIEW.idx - 1] : null;
    const prevQ = prev ? findQ(prev.cn, prev.n) : null;
    const sameSec = prevQ && prevQ.q.sec === q.sec;
    if (sameSec || !q.sec) return '';
    const m = q.sec.match(/^([一二三四五六七八九十]+)、(.+)$/);
    return `<div class="secbar">${m ? `<span class="sn">${m[1]}</span>${esc(m[2])}` : esc(q.sec)}</div>`;
  })()}
  <div class="qcard">
    <div class="tagrow">
      <span class="ttype ${TYPE_CLS(q.t)}">${esc(q.t)}</span>
      <span class="ttype" style="background:var(--card2);color:var(--txt3)">第${ch.no}章</span>
      ${isReview && myAns !== undefined ? `<span class="ttype" style="background:${myAns === q.a ? 'var(--ok-l)' : 'var(--no-l)'};color:${myAns === q.a ? 'var(--ok)' : 'var(--no)'}">${myAns === q.a ? '已答对' : '本次做错'}</span>` : ''}
      ${isReview && myAns === undefined ? `<span class="ttype" style="background:var(--card2);color:var(--txt3)">重新作答中</span>` : ''}
      ${q.f.length ? q.f.map(x => `<span class="flag">${esc(x)}</span>`).join('') : ''}
      <button class="star ${isFav(k) ? 'on' : ''}" data-act="fav">${isFav(k) ? '★' : '☆'}</button>
    </div>
    <div class="stem"><span class="num">${VIEW.idx + 1}.</span>${esc(q.s)}</div>
    <div class="opts">${optsHtml}</div>
    ${anaHtml}
    ${isReview ? `<div class="li-act" style="margin:12px 0 0">
      <button class="btn gho" data-act="reviewAgain">重新作答本题</button>
      <button class="btn ${MASTERED[k] ? 'grn' : 'gho'}" data-act="toggleMaster">${MASTERED[k] ? '✓ 已掌握' : '标记已掌握'}</button>
    </div>` : ''}
  </div>

  <div class="actbar">
    <button class="btn gho" data-act="prev" ${VIEW.idx === 0 ? 'disabled style="opacity:.45"' : ''}>上一题</button>
    ${isFill && !revealed
      ? `<button class="btn pri" data-act="revealFill">看参考答案</button>`
      : isFill && !checked
        ? `<button class="btn grn" data-act="fillOK">我答对了</button><button class="btn gho" data-act="fillNO" style="color:var(--no);border-color:var(--no)">我答错了</button>`
        : showAna
      ? `<button class="btn pri" data-act="next">${VIEW.idx === total - 1 ? (isRound ? '完成本轮' : (isReview ? '完成回顾' : (isLookup ? '结束速览' : '完成本章'))) : '下一题'}</button>`
      : (isRecite
          ? `<button class="btn pri" data-act="next">下一题</button>`
          : (multi
              ? `<button class="btn pri" data-act="submit" ${myAns ? '' : 'disabled'}>提交答案</button>`
              : `<button class="btn pri" data-act="next">下一题</button>`))}
    <button class="btn gho sm" data-act="card">答题卡</button>
  </div>`;
  return h;
}

/* 提交判定 */
function submitAnswer(){
  if (!VIEW) return;
  const f = curQ(); if (!f) return;
  const { q } = f;
  const myAns = VIEW.ans[q.n];
  if (!myAns) { toast('请先选择答案'); return; }
  VIEW.checked[q.n] = true;
  const k = key(f.ch.no, q.n);
  const isRight = myAns === q.a;

  // 记录进度
  if (VIEW.mode === 'chapter') {
    const p = PROGRESS[f.ch.no] || { idx:0, ans:{}, chk:{} };
    p.ans = p.ans || {}; p.chk = p.chk || {};
    p.ans[q.n] = myAns; p.chk[q.n] = true; p.idx = VIEW.idx;
    PROGRESS[f.ch.no] = p; saveP();
  }
  // 本轮模式：写入本轮记录（复合键，跨章不冲突）
  if (VIEW.mode === 'round' && ROUND) {
    ROUND.ans = ROUND.ans || {}; ROUND.checked = ROUND.checked || {};
    ROUND.ans[k] = myAns; ROUND.checked[k] = true; ROUND.idx = VIEW.idx;
    saveR();
  }
  // 本轮/回顾模式下也把作答写回章节进度，保证章节进度与统计同步
  if ((VIEW.mode === 'round' || VIEW.mode === 'review') && VIEW.mode !== 'chapter') {
    const p = PROGRESS[f.ch.no] || { idx:0, ans:{}, chk:{} };
    p.ans = p.ans || {}; p.chk = p.chk || {};
    p.ans[q.n] = myAns; p.chk[q.n] = true;
    PROGRESS[f.ch.no] = p; saveP();
  }

  // 错题收录
  if (!isRight) {
    WRONG_A[k] = true; saveWA();
    if (VIEW.mode !== 'wrong') { WRONG_P[k] = true; saveWP(); }
  } else {

    // 在错题本里重刷答对 → 从待攻克移出
    if (VIEW.mode === 'wrong') { delete WRONG_P[k]; saveWP(); }
  }
  updateNavDot();
  render();
}

/* 跳题 */
function saveViewPos(){
  if (!VIEW) return;
  if (VIEW.mode === 'chapter') {
    const p = PROGRESS[VIEW.cn] || { idx:0, ans:{}, chk:{} };
    p.idx = VIEW.idx; PROGRESS[VIEW.cn] = p; saveP();
  } else if (VIEW.mode === 'round' && ROUND) {
    ROUND.idx = VIEW.idx; ROUND.ans = VIEW.ans; ROUND.checked = VIEW.checked;
    saveR();
  }
}
function goNext(){
  if (!VIEW) return;
  // 搜索速览看完了 → 直接回到搜索页（不弹结算页）
  if (VIEW.mode === 'lookup' && VIEW.idx >= VIEW.list.length - 1) { VIEW = null; TAB = 'search'; render(); return; }
  if (VIEW.idx >= VIEW.list.length - 1) { finish(); return; }
  VIEW.idx++;
  saveViewPos();
  render();
}
function goPrev(){
  if (!VIEW || VIEW.idx === 0) return;
  VIEW.idx--;
  saveViewPos();
  render();
}
function jumpTo(i){ VIEW.idx = i; closeSheet(); saveViewPos(); render(); }

/* 本轮错题列表（按全库顺序） */
function roundWrongList(){
  if (!ROUND || !ROUND.list) return [];
  return ROUND.list.filter(it => {
    const f = findQ(it.cn, it.n); if (!f) return false;
    const a = (ROUND.ans || {})[key(it.cn, it.n)];
    return a !== undefined && a !== f.q.a;
  });
}

/* 进入本轮错题回顾 */
function startReview(){
  const wl = roundWrongList();
  if (!wl.length) { toast('本轮全对，没有错题'); return; }
  VIEW = {
    mode:'review', cn:null, from:'round',
    title:`本轮错题回顾 · ${wl.length} 题`,
    list: wl, idx:0, ans:{}, checked:{}, recite:false
  };
  // 回顾时直接展示答案与解析，并带入本轮作答
  wl.forEach(it => {
    const kk = key(it.cn, it.n);
    const f = findQ(it.cn, it.n);
    if (!f) return;
    if (ROUND.ans && ROUND.ans[kk] !== undefined) {
      VIEW.ans[f.q.n] = ROUND.ans[kk];
      VIEW.checked[f.q.n] = true;
    }
  });
  render();
}
function completeRound(){
  if (!ROUND) return;
  ROUND.done = true;
  const total = ROUND.list.length;
  const wl = roundWrongList();
  ROUND.wrongCount = wl.length;
  ROUND.correctCount = total - wl.length;
  saveR();
  invalidateSeq();
}
function openRoundSummary(){
  const rp = roundProgress();
  const wl = roundWrongList();
  const wrong = wl.length;
  const correct = (ROUND.list ? ROUND.list.length : 0) - wrong;
  const rate = ROUND.list && ROUND.list.length ? Math.round(correct / ROUND.list.length * 100) : 0;

  const box = document.createElement('div');
  box.innerHTML = `
    <div class="result">
      <div class="big">${rate}%</div>
      <div class="lb">本轮正确率（第 ${ROUND.roundNo || 1} 轮 · 共 ${ROUND.list.length} 题）</div>
      <div class="rgrid">

/* 完成 */
function finish(){
  // 本轮模式：走本轮结算
  if (VIEW && VIEW.mode === 'round') { completeRound(); openRoundSummary(); return; }
  // 回顾模式：完成后回到错题本
  if (VIEW && VIEW.mode === 'review') {
    const wl = VIEW.list.length;
    const box = document.createElement('div');
    box.innerHTML = `<div class="result">
      <div class="big" style="font-size:38px">✓</div>
      <div class="lb">错题回顾已完成（${wl} 题）</div>
    </div>`;
    const bar = document.createElement('div');
    bar.className = 'actbar';
    bar.innerHTML = `<button class="btn gho" data-f="exit">返回首页</button>
      <button class="btn pri" data-f="board">去错题本</button>`;
    const wrap = document.createElement('div');
    wrap.className = 'mask on'; wrap.style.background = 'var(--bg)'; wrap.style.zIndex = 70;
    wrap.style.overflowY = 'auto';
    const inner = document.createElement('div');
    inner.style.cssText = 'width:100%;max-width:430px;margin:0 auto;padding:14px';
    inner.appendChild(box); wrap.appendChild(inner);
    bar.style.zIndex = 71;
    document.body.appendChild(wrap); document.body.appendChild(bar);
    const clean = () => { wrap.remove(); bar.remove(); };
    bar.querySelector('[data-f="exit"]').onclick = () => { clean(); VIEW = null; TAB='home'; render(); };
    bar.querySelector('[data-f="board"]').onclick = () => { clean(); VIEW = null; TAB='wrong'; render(); };
    return;
  }

  const total = VIEW.list.length;
  let correct = 0, wrong = 0;
  VIEW.list.forEach(it => {
    const f = findQ(it.cn, it.n); if (!f) return;
    const a = VIEW.ans[f.q.n];
    if (a === undefined) return;
    if (a === f.q.a) correct++; else wrong++;
  });
  const undone = total - correct - wrong;
  const rate = (correct + wrong) ? Math.round(correct / (correct + wrong) * 100) : 0;

  const isChapter = VIEW.mode === 'chapter';
  const box = document.createElement('div');
  box.innerHTML = `
    <div class="result">
      <div class="big">${rate}%</div>
      <div class="lb">本次正确率</div>
      <div class="rgrid">
        <div class="c g"><b>${correct}</b><span>答对</span></div>
        <div class="c r"><b>${wrong}</b><span>答错</span></div>
        <div class="c b"><b>${undone}</b><span>未答</span></div>
      </div>
      ${isChapter ? `<div class="done-hint">${roundOn() ? `本段共 ${total} 题，已完成查看` : `本章共 ${total} 题，已完成查看`}</div>` : ''}
    </div>
    <div class="qcard">
      <div style="font-size:13px;line-height:1.9;color:var(--txt2)">
        ${wrong ? `📕 本组新增/累计错题 <b style="color:var(--no)">${wrong}</b> 题，已收录到错题本。<br>` : ''}
        ${isChapter ? '💡 进度已自动保存，下次可继续。' : ''}
      </div>
    </div>
    ${wrong && VIEW.mode !== 'wrong' ? `
    <div class="qcard" style="text-align:center">
      <div style="font-size:13px;color:var(--txt2);line-height:1.8;margin-bottom:13px">
        这 <b style="color:var(--no)">${wrong}</b> 道错题可直接查看答案与解析，逐题看明白，再重做一遍。
      </div>
      <div class="li-act" style="margin-bottom:0">
        <button class="btn pri" data-f="rwAna">错题解析回顾（${wrong} 题）</button>
      </div>
    </div>` : ''}
    <div style="height:9px"></div>`;
  const bar = document.createElement('div');
  bar.className = 'actbar';
  bar.innerHTML = `
    <button class="btn gho" data-f="exit">返回</button>
    ${wrong && VIEW.mode !== 'wrong' ? `<button class="btn gho" data-f="rw">回看错题</button>` : ''}
    <button class="btn pri" data-f="again">再刷一遍</button>`;

  // 用遮罩形式展示
  const wrap = document.createElement('div');
  wrap.className = 'mask on'; wrap.style.background = 'var(--bg)'; wrap.style.zIndex = 70;
  wrap.style.overflowY = 'auto'; wrap.style.paddingBottom = '88px';
  const inner = document.createElement('div');
  inner.style.cssText = 'width:100%;max-width:430px;margin:0 auto;padding:14px';
  inner.appendChild(box);
  wrap.appendChild(inner);
  bar.style.zIndex = 71;
  document.body.appendChild(wrap);
  document.body.appendChild(bar);

  const clean = () => { wrap.remove(); bar.remove(); };
  bar.querySelector('[data-f="exit"]').onclick = () => { clean(); VIEW = null; render(); };
  const againBtn = bar.querySelector('[data-f="again"]');
  if (againBtn) againBtn.onclick = () => { clean(); restartView(); };
  const rwBtn = bar.querySelector('[data-f="rw"]');
  if (rwBtn) rwBtn.onclick = () => { clean(); studyWrongOfView(); };
  // 「错题解析回顾」按钮在内容区（box）里，需从 box 绑定
  const raBtn = box.querySelector('[data-f="rwAna"]');
  if (raBtn) raBtn.onclick = () => { clean(); reviewWrongOfView(); };
}

/* 回看本组错题 */
function studyWrongOfView(){
  if (!VIEW) return;
  const wrongList = VIEW.list.filter(it => {
    const f = findQ(it.cn, it.n); if (!f) return false;
    const a = VIEW.ans[f.q.n];
    return a !== undefined && a !== f.q.a;
  });
  if (!wrongList.length) { toast('本组没有做错的题'); return; }
  VIEW = { mode:'wrong', cn:null, from:'group', title:'本组错题回看', list:wrongList, idx:0, ans:{}, checked:{}, recite:false };
  render();
}

/* 进入本组错题的解析回顾（review 模式：直接显示答案与解析，并带入本组作答） */
function reviewWrongOfView(){
  if (!VIEW) return;
  const keepAns = VIEW.ans || {};
  const wrongList = VIEW.list.filter(it => {
    const f = findQ(it.cn, it.n); if (!f) return false;
    const a = keepAns[f.q.n];
    return a !== undefined && a !== f.q.a;
  });
  if (!wrongList.length) { toast('本组没有做错的题'); return; }
  VIEW = {
    mode:'review', cn:null, from:'group',
    title:`本组错题解析 · ${wrongList.length} 题`,
    list: wrongList, idx:0, ans:{}, checked:{}, recite:false
  };
  // 带入本组作答 → 每题显示「已答对 / 本次做错」徽章
  wrongList.forEach(it => {
    const f = findQ(it.cn, it.n); if (!f) return;
    if (keepAns[f.q.n] !== undefined) { VIEW.ans[f.q.n] = keepAns[f.q.n]; VIEW.checked[f.q.n] = true; }
  });
  render();
}
function restartView(){
  if (!VIEW) return;
  // 章节 + 本轮功能开启：不必重刷同一段（已做完，起点已前移），直接重建下一段
  if (VIEW.mode === 'chapter' && roundOn()) {
    const cn = VIEW.cn;
    VIEW = null;
    startStudy('chapter', cn);
    return;
  }
  VIEW.idx = 0; VIEW.ans = {}; VIEW.checked = {};
  if (VIEW.mode === 'chapter') { PROGRESS[VIEW.cn] = { idx:0, ans:{}, chk:{} }; saveP(); }
  render();
}

function openSheet(){

/* ================= 数据导入导出 ================= */
/* 运行环境判断：在 APK 里跑时 window.NativeBridge 被注入。
   WebView 没有内置下载器，a[download]+click() 会被静默丢弃，
   所以 APK 内必须走原生写文件；浏览器里仍用原来的下载方式。 */
function isApp(){ return !!(window.NativeBridge && window.NativeBridge.available && window.NativeBridge.available()); }

function exportData(){
  const payload = {
    app:'__NS__-quiz', ver:3, exportedAt:new Date().toISOString(),
    progress:PROGRESS, wrongPending:WRONG_P, wrongAll:WRONG_A, favorites:FAV,
    settings:SET, round:ROUND, mastered:MASTERED, history:HIST,
    analysisVer:1
  };
  const json = JSON.stringify(payload, null, 2);
  const d = new Date();
  const stamp = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}_${String(d.getHours()).padStart(2,'0')}${String(d.getMinutes()).padStart(2,'0')}`;
  writeOut(DATA.name + '刷题备份_' + stamp + '.json', json, 'application/json');
}
/**
 * 统一的"导出落盘"入口。
 * APK：写进 App 私有导出目录，并提示路径（可在设置页「导出文件」里管理）
 * 浏览器：走 Blob 下载
 */
function writeOut(name, text, mime){
  if (isApp()) {
    try {
      const saved = window.NativeBridge.writeFile(name, text);
      if (saved) {
        toast('已导出到 App 文件：' + saved);
        if (SET && typeof SET === 'object') { /* 仅提示，不改设置 */ }
        refreshExportList();
        return true;
      }
      toast('导出失败：无法写入文件');
      return false;
    } catch(err) {
      toast('导出失败：' + (err && err.message ? err.message : err));
      return false;
    }
  }
  downloadBlob(new Blob([text], {type:mime || 'text/plain;charset=utf-8'}), name);
  toast('已导出 ' + name);
  return true;
}
function downloadBlob(blob, name){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 400);
}
function importData(){
  // APK 内走原生选择器：WebView 里 <input type=file> 需要 WebChromeClient
  // 支持，虽然已经补上，但原生通道能直接拿到文件名与内容，更稳。
  if (isApp() && window.NativeBridge.pickFile) {
    window.__importCb = true;
    window.NativeBridge.pickFile();
    return;
  }
  $('fileIn').click();
}
/* 原生选择器回调（由 MainActivity.deliverPickResult 调用） */
window.__onNativePickResult = function(res){
  if (!res) { toast('导入取消'); return; }
  if (!res.ok) { if (res.msg && res.msg !== '已取消') toast(res.msg); return; }
  try {
    const d = JSON.parse(res.content);
    applyImport(d, res.name);
  } catch(err) {
    toast('导入失败：文件格式不正确');
  }
};
function doImport(file){
  const r = new FileReader();
  r.onload = e => {
    try {
      const d = JSON.parse(e.target.result);
      applyImport(d, file.name);
    } catch(err) { toast('导入失败：文件格式不正确'); }
  };
  r.readAsText(file);
}
/** 导入数据落地（原生与浏览器两条路共用） */
function applyImport(d, fileName){
  if (!d || typeof d !== 'object') { toast('导入失败：文件格式不正确'); return; }
  // 解析包：单独一种文件类型，只更新解析，不动做题记录
  if (d.app === '__NS__-quiz-analysis') {
    const m = d.map || d.analysis || {};
    ANALYSIS = m;
    try { localStorage.setItem(LS.AN, JSON.stringify({ver:1, map:m})); } catch(err){}
    toast('解析入库成功，共 ' + Object.keys(m).length + ' 条');
    render();
    return;
  }
  if (d.app !== '__NS__-quiz') { toast('导入失败：不是本应用的备份文件'); return; }
  PROGRESS = d.progress || {};
  WRONG_P = d.wrongPending || {};
  WRONG_A = d.wrongAll || {};
  FAV = d.favorites || {};
  // 兼容 ver1（无 round / mastered）→ 用默认值填充
  ROUND = d.round || null;
  MASTERED = d.mastered || {};
  HIST = d.history || {};                 // 兼容 ver1/ver2（无历史记录）
  SET = Object.assign({fs:16, roundN:20, roundOn:true}, d.settings || {});
  saveP(); saveWP(); saveWA(); saveF(); saveS(); saveR(); saveM(); saveH();
  invalidateSeq();
  WRONG_OPEN = new Set(); FAV_OPEN = new Set();
  applyFont();
  updateNavDot();
  toast('导入成功' + (fileName ? '：' + fileName : ''));
  render();
}
function expWrongCsv(){
  const list = wrongKeys(WRONG_TAB);
  if (!list.length) { toast('没有错题可导出'); return; }
  const q2 = s => '"' + String(s == null ? '' : s).replace(/"/g, '""') + '"';
  const rows = [['章节', '章节名', '题型', '题干', '选项', '正确答案', '我的作答'].map(q2).join(',')];
  list.forEach(x => {
    const f = findQ(x.cn, x.n); if (!f) return;
    const opts = Object.keys(f.q.o).map(l => l + '.' + f.q.o[l]).join(' | ');
    const p = (PROGRESS[x.cn] || {}).ans || {};
    rows.push([f.ch.no, f.ch.name, f.q.t, f.q.s, opts, f.q.a, p[x.n] || ''].map(q2).join(','));
  });
  // 加 BOM，Excel 正确识别 UTF-8
  const csv = '\ufeff' + rows.join('\r\n');
  const d = new Date();
  const stamp = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
  writeOut(`错题导出_${WRONG_TAB === 'pending' ? '待攻克' : '全部'}_${stamp}.csv`, csv, 'text/csv;charset=utf-8');
}

/* ================= APK 内导出文件管理 ================= */
/** 读取原生导出目录文件清单，渲染到设置页 */
function refreshExportList(){
  const box = $('expList');
  if (!box) return;
  if (!isApp() || !window.NativeBridge.listFiles) { box.innerHTML = ''; return; }
  let arr = [];
  try { arr = JSON.parse(window.NativeBridge.listFiles() || '[]'); } catch(err) { arr = []; }
  if (!arr.length) {
    box.innerHTML = '<div class="hint" style="margin:0">还没有导出文件。点上方按钮导出后会出现在这里。</div>';
    return;
  }
  box.innerHTML = arr.map(f => {
    const kb = f.size >= 1048576 ? (f.size/1048576).toFixed(2) + ' MB' : Math.max(1, Math.round(f.size/1024)) + ' KB';
    const safe = esc(f.name);
    const isCsv = /\.csv$/i.test(f.name);
    return `<div class="exprow">
      <div class="expinfo">
        <div class="expname">${isCsv ? '📊' : '📋'} ${safe}</div>
        <div class="expmeta">${kb} · ${esc(f.time)}</div>
      </div>
      <div class="expacts">
        ${!isCsv ? `<button class="mini" data-imp="${safe}">导入</button>` : ''}
        <button class="mini" data-share="${safe}">分享</button>
        <button class="mini" data-save="${safe}" data-mime="${isCsv ? 'text/csv' : 'application/json'}">存到下载</button>
        <button class="mini del" data-del="${safe}">删除</button>
      </div>
    </div>`;
  }).join('');
}
/** 点击导出文件区里的按钮 */
function onExpListClick(e){
  const b = e.target.closest('button[data-imp],button[data-share],button[data-save],button[data-del]');
  if (!b || !isApp()) return;
  if (b.dataset.imp != null) {
    const name = b.dataset.imp;
    let txt = '';
    try { txt = window.NativeBridge.readFile(name); } catch(err) {}
    if (!txt) { toast('读取失败'); return; }
    dialog('导入数据', `即将导入 <b>${esc(name)}</b>，会覆盖当前的刷题记录、错题本与收藏。<br>建议先导出备份。`, () => {
      try { applyImport(JSON.parse(txt), name); }
      catch(err) { toast('导入失败：文件格式不正确'); }
    }, '确认导入');
  } else if (b.dataset.share != null) {
    window.NativeBridge.shareFile(b.dataset.share);
  } else if (b.dataset.save != null) {
    window.NativeBridge.saveToDownloads(b.dataset.save, b.dataset.mime || 'application/json');
  } else if (b.dataset.del != null) {
    const name = b.dataset.del;
    dialog('删除文件', `确定删除 <b>${esc(name)}</b>？此操作不可恢复。`, () => {
      window.NativeBridge.deleteFile(name);
      toast('已删除');
      refreshExportList();
    }, '删除');
  }
}

/* ================= 主渲染 ================= */
function render(){
  renderTop();

  if (VIEW) {
    nav.classList.add('hide');

    bindStudy();
    $('page').scrollTop = 0;
    return;
  }
  nav.classList.remove('hide');
  let html = '';
  if (TAB === 'home') html = viewHome();
  else if (TAB === 'search') html = viewSearch();
  else if (TAB === 'wrong') html = viewWrong();
  else if (TAB === 'fav') html = viewFav();
  else if (TAB === 'stat') html = viewStat();
  else if (TAB === 'set') html = viewSet();
  else if (TAB === 'hist') html = viewHist();
  else if (TAB === 'guide') html = viewGuide();
  $('page').innerHTML = html;
  bindPage();
  nav.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.tab === TAB));
  updateNavDot();
}

/* ================= 事件绑定 ================= */
function bindPage(){
  const pg = $('page');
  pg.querySelectorAll('.chap').forEach(el => {
    el.onclick = () => startStudy('chapter', +el.dataset.cn);
    if (EXP[el.dataset.cn]) setExpanded(el, true);
  });
  pg.querySelectorAll('.stog').forEach(btn => {
    btn.onclick = ev => {
      ev.stopPropagation();
      const card = btn.closest('.chap');
      setExpanded(card, !card.classList.contains('open'));
    };
  });
  pg.querySelectorAll('.srow').forEach(el => {
    el.onclick = ev => { ev.stopPropagation(); startStudy('chapter', +el.dataset.cn, el.dataset.sec); };
  });
  // 章卡上的「重做」「历史」按钮（阻止冒泡，避免触发展开/进入练习）
  pg.querySelectorAll('[data-redo]').forEach(b => {
    b.onclick = ev => { ev.stopPropagation(); redoChapter(+b.dataset.redo); };
  });
  pg.querySelectorAll('[data-hist]').forEach(b => {
    b.onclick = ev => { ev.stopPropagation(); openHist(+b.dataset.hist); };
  });
  // 章卡「先导」→ 先导知识页；页内切小节 / 背完标记 / 开始做题
  pg.querySelectorAll('[data-guide]').forEach(b => {
    b.onclick = ev => { ev.stopPropagation(); openGuide(+b.dataset.guide, 0); };
  });
  pg.querySelectorAll('[data-gsec]').forEach(b => {
    b.onclick = () => { GUIDE_CUR.sec = +b.dataset.gsec; render(); window.scrollTo(0, 0); };
  });
  pg.querySelectorAll('[data-gprev]').forEach(b => {
    b.onclick = () => { if (GUIDE_CUR.sec > 0) { GUIDE_CUR.sec--; render(); window.scrollTo(0, 0); } };
  });
  pg.querySelectorAll('[data-gnext]').forEach(b => {
    b.onclick = () => {
      const g = guideOf(GUIDE_CUR.cn);
      if (g && GUIDE_CUR.sec < g.secs.length - 1) { GUIDE_CUR.sec++; render(); window.scrollTo(0, 0); }
    };
  });
  pg.querySelectorAll('[data-gdone]').forEach(b => {
    b.onclick = () => { gkToggle(GUIDE_CUR.cn, GUIDE_CUR.sec); render(); };
  });
  pg.querySelectorAll('[data-gstart]').forEach(b => {
    b.onclick = () => { startStudy('chapter', GUIDE_CUR.cn, null); };
  });
  // 导语超过 5 行才显示「展开全文」
  if (TAB === 'guide') {
    const gl = pg.querySelector('.glead');
    const more = pg.querySelector('[data-gmore]');
    if (gl && more) {
      if (gl.scrollHeight > gl.clientHeight + 6) {
        more.style.display = 'inline-block';
        more.onclick = () => { gl.classList.add('open'); more.style.display = 'none'; };
      }
    }
  }
  // 先导知识里超宽的表格，补一行「左右滑动」提示
  pg.querySelectorAll('.gtw').forEach(el => {
    if (el.scrollWidth > el.clientWidth + 4 && TAB === 'guide') {
      const d = document.createElement('div');
      d.className = 'ghint';
      d.textContent = '← 左右滑动查看完整表格 →';
      el.parentNode.insertBefore(d, el.nextSibling);
    }
  });
  // 历史列表 → 某次明细
  pg.querySelectorAll('[data-hsnap]').forEach(el => {
    el.onclick = () => { HIST_CUR.at = +el.dataset.hsnap; HIST_CUR.wrongOnly = false; render(); };
  });
  // 历史明细：只看错题 / 返回列表
  pg.querySelectorAll('[data-hwrong]').forEach(b => {
    b.onclick = () => { HIST_CUR.wrongOnly = b.dataset.hwrong === '1'; render(); };
  });
  pg.querySelectorAll('[data-hback]').forEach(b => {
    b.onclick = () => { HIST_CUR.at = 0; render(); };
  });
  // 错题本 tabs
  pg.querySelectorAll('[data-wt]').forEach(b => {
    b.onclick = () => { WRONG_TAB = b.dataset.wt; WRONG_OPEN = new Set(); render(); };
  });
  // 分组展开/收起
  pg.querySelectorAll('[data-toggle]').forEach(el => {
    el.onclick = e => {
      if (e.target.closest('[data-study]')) return;   // 「练习」按钮不触发展开
      const [kind, cnS] = el.dataset.toggle.split(':');
      const cn = +cnS;
      const set = kind === 'fav' ? FAV_OPEN : WRONG_OPEN;
      set.has(cn) ? set.delete(cn) : set.add(cn);
      render();
    };
  });
  // 分组「练习」按钮 → 仅刷本章
  pg.querySelectorAll('[data-study]').forEach(b => {
    b.onclick = e => {
      e.stopPropagation();
      const [kind, cnS] = b.dataset.study.split(':');
      const cn = +cnS;
      const set = kind === 'fav' ? FAV_OPEN : WRONG_OPEN;
      set.add(cn);                                     // 顺带展开，便于返回时定位
      startStudy(kind === 'fav' ? 'fav' : 'wrong', cn);
    };
  });
  // 列表项点击 → 单题速览（以错题/收藏模式打开，列表限定为所在章）
  pg.querySelectorAll('[data-open]').forEach(el => {
    el.onclick = e => {
      if (e.target.closest('[data-unfav]') || e.target.closest('[data-unmaster]')) return;
      const [cn, n] = el.dataset.open.split('#').map(Number);
      const kind = el.dataset.kind === 'fav' ? 'fav' : 'wrong';
      const src = kind;
      const list = buildList(kind, cn).filter(x => findQ(x.cn, x.n));
      const i = list.findIndex(x => x.cn === cn && x.n === n);
      if (i < 0) return;
      const chName = (DATA.chapters.find(c => c.no === cn) || {}).name || '';
      VIEW = {
        mode: src, cn,
        title: (kind === 'fav' ? '我的收藏' : (WRONG_TAB === 'pending' ? '待攻克错题' : '全部错题')) + ' · 第' + cn + '章',
        list, idx:i, ans:{}, checked:{}, recite:false
      };
      render();
    };
  });
  // 收藏页 / 错题页移除按钮
  pg.querySelectorAll('[data-unfav]').forEach(b => {
    b.onclick = e => {
      e.stopPropagation();
      delete FAV[b.dataset.unfav]; saveF(); toast('已取消收藏'); render();
    };
  });
  pg.querySelectorAll('[data-unmaster]').forEach(b => {
    b.onclick = e => {
      e.stopPropagation();
      const kk = b.dataset.unmaster;
      delete MASTERED[kk]; saveM(); toast('已取消「已掌握」标记'); render();
    };
  });
  // 底部操作按钮
  pg.querySelectorAll('[data-act]').forEach(b => {
    b.onclick = () => {
      const a = b.dataset.act;
      if (a === 'studyWrong') startStudy('wrong', null);
      else if (a === 'studyFav') startStudy('fav', null);
      else if (a === 'newRound') {
        // 有未完成的本轮 → 先确认放弃
        const rp = roundProgress();
        if (rp && !rp.finished && rp.done > 0) {
          dialog('开始新一轮', `当前第 ${ROUND.roundNo || 1} 轮已答 ${rp.done}/${rp.total} 题，开始新一轮将<b>放弃本轮进度</b>。`,
            () => startRound(SET.roundN), '确认放弃');
        } else startRound(SET.roundN);
      }
      else if (a === 'resumeRound') resumeRound();
      else if (a === 'toggleRound') {
        SET.roundOn = !roundOn(); saveS();
        toast(SET.roundOn ? '已开启本轮刷题功能' : '已关闭，点章节将刷整章');
        render();
      }
      else if (a === 'saveRoundN') {
        const inp = $('roundNInput');
        let v = parseInt(inp && inp.value, 10);
        if (!v || v < 1) { toast('请输入大于 0 的题量'); return; }
        if (v > DATA.total) { v = DATA.total; toast('题量超过题库总数，已按 ' + DATA.total + ' 题设定'); }
        SET.roundN = v; saveS(); render();
      }
      else if (a === 'export') exportData();
      else if (a === 'import') importData();
      else if (a === 'expWrongCsv') expWrongCsv();
      else if (a === 'resetAll') {
        dialog('清空全部数据', '将删除所有刷题进度、答题历史、错题本、收藏、本轮记录与已掌握标记，且<b>无法恢复</b>。建议先导出备份。', () => {
          PROGRESS = {}; WRONG_P = {}; WRONG_A = {}; FAV = {}; ROUND = null; MASTERED = {}; HIST = {};
          saveP(); saveWP(); saveWA(); saveF(); saveR(); saveM(); saveH();
          WRONG_OPEN = new Set(); FAV_OPEN = new Set();
          invalidateSeq();
          toast('已清空'); TAB = 'home'; render();
        }, '确认清空');
      }
    };
  });
  // 字号
  pg.querySelectorAll('[data-fs]').forEach(b => {
    b.onclick = () => { SET.fs = +b.dataset.fs; applyFont(); render(); toast('字号已调整为 ' + b.textContent.trim()); };
  });
  // 每轮题量（预设档位）
  pg.querySelectorAll('[data-roundn]').forEach(b => {
    b.onclick = () => {
      const v = b.dataset.roundn;
      if (v === 'custom') {
        const inp = $('roundNInput');
        if (inp) { inp.focus(); inp.select && inp.select(); }
        toast('请输入题量后点保存');
        return;
      }
      SET.roundN = +v; saveS(); render();
      toast('每轮题量已设为 ' + v + ' 题');
    };
  });
  // 导出文件管理（APK 内才有内容）
  const expBox = $('expBox');
  if (expBox && isApp()) expBox.style.display = '';
  const expList = $('expList');
  if (expList) {
    expList.addEventListener('click', onExpListClick);
    refreshExportList();
  }
  // 搜索页
  if (TAB === 'search') bindSearch();
}

function bindStudy(){
  const pg = $('page');
  // 选项
  pg.querySelectorAll('.opt').forEach(el => {
    el.onclick = () => {
      if (!VIEW) return;
      const f = curQ(); if (!f) return;
      const k = key(f.ch.no, f.q.n);
      if (VIEW.checked[f.q.n]) return;         // 已判定不可改
      if (VIEW.recite) return;                 // 背题模式不可选
      const letter = el.dataset.letter;
      const multi = f.q.a.length > 1;
      let cur = VIEW.ans[f.q.n] || '';
      if (multi) {
        const set = new Set(cur.split(''));
        set.has(letter) ? set.delete(letter) : set.add(letter);
        cur = [...set].sort().join('');
      } else {
        cur = letter;
      }
      VIEW.ans[f.q.n] = cur;
      // 记录选中态到进度（章节模式），并立即重绘以更新选项高亮与提交按钮
      if (VIEW.mode === 'chapter') {
        const p = PROGRESS[VIEW.cn] || { idx:0, ans:{}, chk:{} };
        p.ans = p.ans || {}; p.ans[f.q.n] = cur; p.idx = VIEW.idx;
        PROGRESS[VIEW.cn] = p; saveP();
      }
      // 单选 / 判断题：点选项即判定出答案，无需确认作答
      if (!multi) { submitAnswer(); return; }
      render();
    };
  });
  // 操作按钮
  pg.querySelectorAll('[data-act]').forEach(b => {
    b.onclick = () => {
      const a = b.dataset.act;
      if (a === 'revealFill') {
        const f = curQ(); if (!f) return;
        VIEW.reveal = VIEW.reveal || {}; VIEW.reveal[f.q.n] = true; render();
      }
      else if (a === 'fillOK' || a === 'fillNO') {
        const f = curQ(); if (!f) return;
        VIEW.ans[f.q.n] = a === 'fillOK' ? 'A' : 'B';
        VIEW.reveal = VIEW.reveal || {}; VIEW.reveal[f.q.n] = true;
        submitAnswer();
      }
      else if (a === 'prev') goPrev();
      else if (a === 'next') goNext();
      else if (a === 'submit') submitAnswer();
      else if (a === 'card') openSheet();
      else if (a === 'fav') {
        const f = curQ(); if (!f) return;
        const k = key(f.ch.no, f.q.n);
        if (isFav(k)) { delete FAV[k]; toast('已取消收藏'); }
        else { FAV[k] = Date.now(); toast('已收藏'); }
        saveF(); render();
      }
      else if (a === 'exit') {
        // 本轮中途退出：保存进度，下次可继续
        if (VIEW.mode === 'round') { saveViewPos(); toast('本轮进度已保存'); }
        // 本轮发起的回顾 → 回错题本；章节/收藏发起的回顾 → 回原来的页签
        const backTab = (VIEW.mode === 'review' && VIEW.from === 'round') ? 'wrong' : TAB;
        VIEW = null; TAB = backTab; render();
      }
      else if (a === 'toWrongBoard') {
        const rp = roundProgress();
        const go = () => { VIEW = null; TAB = 'wrong'; WRONG_OPEN = new Set(); render(); };
        if (VIEW.mode === 'review') { go(); }
        else go();
      }
      else if (a === 'toggleMaster') {
        const f = curQ(); if (!f) return;
        const k = key(f.ch.no, f.q.n);
        if (MASTERED[k]) { delete MASTERED[k]; toast('已取消「已掌握」'); }
        else {
          MASTERED[k] = true;
          // 标记已掌握 → 从错题本移除（含待攻克与全部错题）
          delete WRONG_P[k]; delete WRONG_A[k];
          saveWP(); saveWA();
          toast('已标记掌握，并从错题本移除');
        }
        saveM(); updateNavDot(); render();
      }
      else if (a === 'chapterHere') {
        // 速览 → 去该题所在章正式练习，并定位到本题
        const f = curQ(); if (!f) return;
        const cn = f.ch.no, n = f.q.n;
        startStudy('chapter', cn);
        if (VIEW) {
          let i = -1;
          VIEW.list.forEach((x, j) => { if (x.cn === cn && x.n === n) i = j; });
          if (i >= 0) { VIEW.idx = i; saveViewPos(); render(); }
        }
      }
      else if (a === 'reviewAgain') {
        // 重新作答本题：清掉本题判定，回到作答态
        const f = curQ(); if (!f) return;
        const k = key(f.ch.no, f.q.n);
        delete VIEW.checked[f.q.n];
        delete VIEW.ans[f.q.n];
        if (ROUND) { delete (ROUND.ans || {})[k]; delete (ROUND.checked || {})[k]; }
        // 同步清回章节进度中的“已答”标记，避免统计重复
        const p = PROGRESS[f.ch.no] || {};
        if (p.ans) delete p.ans[f.q.n];
        if (p.chk) delete p.chk[f.q.n];
        PROGRESS[f.ch.no] = p; saveP(); saveR();
        toast('已重置本题，请重新作答');
        render();
      }
      else if (a === 'toggleRecite') {
        VIEW.recite = !VIEW.recite;
        // 切换模式时记录当前题号，保证进度不丢
        if (VIEW.mode === 'chapter') {
          const p = PROGRESS[VIEW.cn] || { idx:0, ans:{}, chk:{} };
          p.idx = VIEW.idx; PROGRESS[VIEW.cn] = p; saveP();
        }
        toast(VIEW.recite ? '已开启背题模式' : '已切回常规模式');
        render();
      }
    };
  });
}

/* 答题卡点击（事件委托） */
$('sheet').addEventListener('click', e => {
  const j = e.target.closest('[data-jump]');
  if (j) { jumpTo(+j.dataset.jump); return; }
  if (e.target.closest('[data-cl]')) closeSheet();
});
$('mask').addEventListener('click', closeSheet);
$('fileIn').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  dialog('导入数据', `支持两类文件：<br>① <b>详细解析包</b>（只更新解析）；<br>② <b>刷题备份</b>（覆盖记录/错题/收藏）。<br>请选择 <b>${esc(f.name)}</b> 继续。`, () => doImport(f), '确认导入');
  e.target.value = '';
});
/* 底部导航 */
$('nav').addEventListener('click', e => {
  const b = e.target.closest('button[data-tab]');
  if (!b) return;
  TAB = b.dataset.tab;
  render();
});

/* 返回键 / 手势兜底 */
window.addEventListener('popstate', () => {
  if (VIEW) { VIEW = null; render(); history.pushState(null, '', location.href); }
});

/* ================= 启动 ================= */
(function init(){
  applyFont();
  // 解析缓存兜底：index.html 未内联解析时，从 localStorage 读取（导入解析包后生效）
  try {
    const raw = localStorage.getItem(LS.AN);
    if (raw) {
      const o = JSON.parse(raw);
      if (o && o.ver === 1 && o.map && !Object.keys(ANALYSIS).length) ANALYSIS = o.map;
    }
  } catch(e){}
  // 兼容旧数据
  Object.keys(PROGRESS).forEach(cn => {
    const p = PROGRESS[cn];
    if (p && p.ans && !p.chk) { p.chk = {}; Object.keys(p.ans).forEach(n => p.chk[n] = true); }
  });
  history.pushState(null, '', location.href);
  render();
})();
</script>
